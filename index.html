/* ---------------- Alamat bertingkat: Provinsi > Kota/Kab > Kecamatan > Desa ----------------
   Memakai API publik data wilayah Indonesia (emsifa/api-wilayah-indonesia, static JSON via
   CDN) agar file tetap ringan — tidak perlu membundel puluhan ribu data desa ke index.html.
   Butuh koneksi internet saat formulir dibuka (sama seperti kebutuhan Firebase). */
const WILAYAH_API_BASE = "https://www.emsifa.com/api-wilayah-indonesia/api";
async function fetchWilayah(path){
  const res = await fetch(`${WILAYAH_API_BASE}/${path}`);
  if(!res.ok) throw new Error("Gagal memuat data wilayah");
  return res.json();
}
function wilayahSelect(id, placeholder){
  const sel = el("select", { id, disabled: "disabled" });
  sel.appendChild(el("option",{value:""}, placeholder));
  return sel;
}
function resetWilayahSelect(sel, placeholder, disabled){
  sel.innerHTML = "";
  sel.appendChild(el("option",{value:""}, placeholder));
  sel.disabled = !!disabled;
}
function rapidAddressCascade(){
  const wrap = el("div",{class:"field"});
  wrap.appendChild(el("label",{class:"q"}, "Alamat"));

  const box = el("div",{});
  box.appendChild(rapidTextareaField("alamat_lengkap","Alamat Lengkap Sesuai KTP"));
  box.appendChild(el("div",{class:"row2"},
    rapidTextField("rt","RT"),
    rapidTextField("rw","RW"),
  ));

  const selProvinsi = wilayahSelect("rf-provinsi_id", "Memuat provinsi…");
  const selKota = wilayahSelect("rf-kota_kab_id", "Pilih Provinsi dahulu");
  const selKec = wilayahSelect("rf-kecamatan_id", "Pilih Kota/Kab dahulu");
  const selDesa = wilayahSelect("rf-desa_kelurahan_id", "Pilih Kecamatan dahulu");
  selProvinsi.disabled = true;

  const wrapSel = (label, sel) => el("div",{class:"field"}, el("label",{class:"q", style:"font-size:12.5px;"}, label), sel);

  box.appendChild(el("div",{class:"row2"}, wrapSel("Provinsi", selProvinsi), wrapSel("Kota / Kabupaten", selKota)));
  box.appendChild(el("div",{class:"row2"}, wrapSel("Kecamatan", selKec), wrapSel("Desa / Kelurahan", selDesa)));
  const errBox = el("div",{class:"hint"}, "");
  box.appendChild(errBox);

  fetchWilayah("provinces.json").then(list=>{
    resetWilayahSelect(selProvinsi, "Pilih Provinsi...", false);
    list.forEach(p=> selProvinsi.appendChild(el("option",{value:p.id}, p.name)));
  }).catch(()=>{
    resetWilayahSelect(selProvinsi, "Gagal memuat (cek koneksi internet)", true);
    errBox.textContent = "Daftar provinsi gagal dimuat — periksa koneksi internet lalu muat ulang halaman.";
  });

  selProvinsi.addEventListener("change", async ()=>{
    const opt = selProvinsi.selectedOptions[0];
    rapidForm.provinsi = opt && opt.value ? opt.text : "";
    resetWilayahSelect(selKota, "Memuat…", true);
    resetWilayahSelect(selKec, "Pilih Kota/Kab dahulu", true);
    resetWilayahSelect(selDesa, "Pilih Kecamatan dahulu", true);
    rapidForm.kota_kab = ""; rapidForm.kecamatan = ""; rapidForm.desa_kelurahan = "";
    if(!selProvinsi.value){ resetWilayahSelect(selKota, "Pilih Provinsi dahulu", true); return; }
    try{
      const list = await fetchWilayah(`regencies/${selProvinsi.value}.json`);
      resetWilayahSelect(selKota, "Pilih Kota/Kabupaten...", false);
      list.forEach(r=> selKota.appendChild(el("option",{value:r.id}, r.name)));

/* ---------------- Kalkulator kelayakan (mini gauge) ---------------- */
function getRapidPerCapita(){
  const total = parseFloat(rapidForm.total_penghasilan) || 0;
  const tanggungan = parseFloat(rapidForm.jumlah_tanggungan) || 1;
  return total / Math.max(tanggungan, 1);
}
function refreshRapidGauge(){
  const perCapita = getRapidPerCapita();
  const cls = classifyPerCapita(perCapita);
  const figure = $("#rapid-kifayah-figure");
  const badge = $("#rapid-kifayah-badge");
  if(figure) figure.textContent = Math.round(perCapita).toLocaleString("id-ID");
  if(badge) badge.textContent = cls.label;
  const spans = $$(".rapid-thresholds span");
  spans.forEach(s=>s.classList.remove("on"));
  const idxMap = { extreme:0, gk:1, hk:2 };
  const idx = idxMap[cls.key];
  if(idx != null && spans[idx]) spans[idx].classList.add("on");
  else if(spans[3]) spans[3].classList.add("on");
}
function renderRapidGauge(){
  const perCapita = getRapidPerCapita();
  const cls = classifyPerCapita(perCapita);
  return el("div",{class:"kifayah-gauge"},
    el("div",{class:"eyebrow"}, "Pendapatan / Kapita / Bulan · Otomatis"),
    el("div",{class:"figure"}, el("span",{class:"cur"},"Rp"), el("span",{id:"rapid-kifayah-figure"}, Math.round(perCapita).toLocaleString("id-ID"))),
    el("div",{class:"badge"}, el("span",{class:"dot"}), el("span",{id:"rapid-kifayah-badge"}, cls.label)),
    el("div",{class:"thresholds rapid-thresholds"},
      el("span",{class: cls.key==="extreme"?"on":""}, "< 351.957 Extreme Poor"),
      el("span",{class: cls.key==="gk"?"on":""}, "< 609.160 Batas GK"),
      el("span",{class: cls.key==="hk"?"on":""}, "< 979.989 Batas HK"),
      el("span",{class: ["extreme","gk","hk"].includes(cls.key) ? "" : "on"}, "≥ 979.989 Di atas HK"),
    )
  );
}

/* ---------------- Kategori Asnaf — dihitung otomatis ---------------- */
/* Gabungan alamat bertingkat (Rapid Assessment) jadi satu baris teks, dipakai di PDF & ringkasan. */
function fullAlamatRapid(sub){
  const parts = [
    sub.alamat_lengkap,
    sub.rt ? `RT ${sub.rt}` : null,
    sub.rw ? `RW ${sub.rw}` : null,
    sub.desa_kelurahan, sub.kecamatan, sub.kota_kab, sub.provinsi
  ].filter(Boolean);
  return parts.join(", ");
}
function computeAsnaf(data){
  const cats = [];
  if(data.pekerjaan_kepala === "Menganggur") cats.push("Fakir");
  const tanggungan = parseFloat(data.jumlah_tanggungan) || 1;
  const penghasilan = parseFloat(data.total_penghasilan) || 0;
  const perCapita = penghasilan / Math.max(tanggungan, 1);
  if(perCapita < 979989) cats.push("Miskin");
  if(data.is_muallaf) cats.push("Muallaf");
  const hutang = parseFloat(data.jumlah_hutang) || 0;
  if(hutang > 0 && hutang > penghasilan) cats.push("Gharim");
  if(data.pekerjaan_kepala === "Lainnya" && data.pekerjaan_kepala_lainnya){
    const t = data.pekerjaan_kepala_lainnya.toLowerCase();
    if(t.includes("pelajar") || t.includes("guru")) cats.push("Fisabilillah");
  }
  return cats;
}
function renderAsnafBadgeSpans(cats){
  if(cats.length === 0) return [el("span",{class:"asnaf-badge asnaf-badge-empty"}, "Belum ada kategori terdeteksi")];
  return cats.map(c=>el("span",{class:"asnaf-badge"}, c));
}
function refreshAsnafBadges(){
  const box = $("#asnaf-badges");
  if(!box) return;
  box.innerHTML = "";
  renderAsnafBadgeSpans(computeAsnaf(rapidForm)).forEach(s=>box.appendChild(s));
}
function renderAsnafBadgesBlock(){
  return el("div",{class:"field"},
    el("label",{class:"q"}, "Kategori Asnaf (Otomatis)"),
    el("div",{class:"asnaf-badges", id:"asnaf-badges"}, ...renderAsnafBadgeSpans(computeAsnaf(rapidForm))),
  );
}

/* ---------------- Signature pad (canvas) ---------------- */
function createSignaturePad(){
  const width = 320, height = 140;
  const dpr = window.devicePixelRatio || 1;
  const canvas = document.createElement("canvas");
  canvas.className = "sigpad-canvas";
  canvas.width = width * dpr; canvas.height = height * dpr;
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = "#1E2624"; ctx.lineWidth = 2.2; ctx.lineCap = "round"; ctx.lineJoin = "round";
  let drawing = false, hasDrawn = false, last = null;
  const pos = (e) => {
    const rect = canvas.getBoundingClientRect();
    const p = e.touches && e.touches.length ? e.touches[0] : e;
    return { x: p.clientX - rect.left, y: p.clientY - rect.top };
  };
  const start = (e) => { e.preventDefault(); drawing = true; last = pos(e); };
  const move = (e) => {
    if(!drawing) return;
    e.preventDefault();
    const p = pos(e);
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    last = p; hasDrawn = true;
  };
  const end = () => { drawing = false; };
  canvas.addEventListener("mousedown", start);
  canvas.addEventListener("mousemove", move);
  window.addEventListener("mouseup", end);
  canvas.addEventListener("touchstart", start, {passive:false});
  canvas.addEventListener("touchmove", move, {passive:false});
  canvas.addEventListener("touchend", end);

  const wrap = el("div",{class:"sigpad-wrap"}, canvas,
    el("div",{class:"sigpad-controls"},
      el("span",{class:"sigpad-hint"}, "Tanda tangan di area ini"),
      el("button",{type:"button", class:"sigpad-clear", onclick:()=>{ ctx.clearRect(0,0,canvas.width,canvas.height); hasDrawn=false; }}, "Hapus")
    )
  );
  return { el: wrap, isEmpty: () => !hasDrawn, toDataURL: () => hasDrawn ? canvas.toDataURL("image/png") : null };
}

function renderNikGateField(sessionIdGetter, restContainer){
  const wrap = el("div",{class:"field"});
  wrap.appendChild(el("label",{class:"q"}, "NIK", el("span",{class:"req"}," *")));
  const inp = el("input",{type:"text", inputmode:"numeric", id:"rf-nik", value: rapidForm.nik||""});
  wrap.appendChild(inp);
  const statusBox = el("div",{class:"hint", id:"nik-gate-status"}, "Masukkan 16 digit NIK terlebih dahulu untuk melanjutkan.");
  wrap.appendChild(statusBox);

  restContainer.classList.add("hidden");

  let checkToken = 0;
  inp.addEventListener("input", async ()=>{
    const digits = inp.value.replace(/\D/g,"").slice(0,16);
    inp.value = digits;
    rapidForm.nik = digits;
    checkToken++;
    const myToken = checkToken;
    restContainer.classList.add("hidden");
    if(digits.length !== 16){
      statusBox.textContent = "Masukkan 16 digit NIK terlebih dahulu untuk melanjutkan.";
      statusBox.className = "hint";
      return;
    }
    statusBox.textContent = "⏳ Memeriksa NIK...";
    statusBox.className = "hint";
    const dup = await checkDuplicateNik(sessionIdGetter(), digits);
    if(myToken !== checkToken) return; // NIK sudah berubah lagi sebelum hasil ini kembali — abaikan hasil basi
    if(dup){
      statusBox.textContent = "✕ NIK ini sudah pernah terdaftar/submit untuk program ini. Isian lain tidak dapat diisi.";
      statusBox.className = "hint nik-gate-blocked";
      restContainer.classList.add("hidden");
    } else {
      statusBox.textContent = "✓ NIK belum terdaftar — silakan lanjutkan mengisi data di bawah.";
      statusBox.className = "hint nik-gate-ok";
      restContainer.classList.remove("hidden");
    }
  });
  return wrap;
}

async function submitDirect(shell){
  if(!rapidForm.nama || !rapidForm.nik){ toast("Nama dan NIK calon penerima manfaat wajib diisi."); return; }
  if(!isValidNik(rapidForm.nik)){ toast("NIK harus tepat 16 digit angka."); return; }
  if(rapidForm.telp && !isValidPhone(rapidForm.telp)){ toast("Nomor telepon tidak valid — gunakan angka saja (9-15 digit)."); return; }
  if(!rapidForm.kelayakan){ toast("Mohon pilih Kelayakan."); return; }
  if(sigPengaju.isEmpty()){ toast("Mohon minta tanda tangan penerima manfaat."); return; }

  await ensureAnonAuth();
  // Pemeriksaan akhir (jaga-jaga ada perubahan sejak gerbang NIK di atas dicek) — kini diblokir
  // TEGAS, tidak lagi bisa dilewati dengan konfirmasi, karena surveyor sudah diberi tahu status
  // NIK sejak awal sebelum mengisi field lain.
  const isDup = await checkDuplicateNik(rapidSession.id, rapidForm.nik);
  if(isDup){ toast("NIK ini sudah terdaftar untuk program ini. Tidak dapat mengirim data duplikat."); return; }

  const btn = $("#rapid-submit-btn");
  btn.disabled = true;
  const orig = btn.textContent;
  btn.innerHTML = ""; btn.appendChild(el("span",{class:"spinner"})); btn.appendChild(document.createTextNode(" Mengirim..."));

  const perCapita = getRapidPerCapita();
  const cls = classifyPerCapita(perCapita);
  const asnaf = computeAsnaf(rapidForm);

  const payload = {
    ...rapidForm,
    pendapatan_per_kapita: perCapita,
    kategori_had_kifayah: cls.label,
    kategori_asnaf: asnaf,
    nama_pengaju: rapidForm.nama,
    session_id: rapidSession.id,
    program_nama: rapidSession.nama_program,
    program_tgl: rapidSession.tgl_pelaksanaan,
    program_lokasi: rapidSession.lokasi_penyaluran,
    program_petugas: rapidSession.nama_petugas,
    program_telp_petugas: rapidSession.telp_petugas,
    program_kategori: rapidSession.kategori_program,
    assigned_by: rapidSession.assigned_by || null,
    performed_by: rapidSession.performed_by || null,
    ttd_petugas: rapidSession.petugas_signature,
    ttd_pengaju: sigPengaju.toDataURL(),
    diisi_oleh: "surveyor",
    jenis_form: "rapid_assessment",
    status_review: "pending",
    submittedAt: FIREBASE_NOT_CONFIGURED ? new Date().toISOString() : firebase.firestore.FieldValue.serverTimestamp(),
  };

  try{
    await ensureAnonAuth();
    if(FIREBASE_NOT_CONFIGURED){
      console.warn("Firebase belum dikonfigurasi. Data tidak benar-benar tersimpan. Payload:", payload);
      await new Promise(r=>setTimeout(r,500));
    } else {
      await db.collection(COLLECTION).add(payload);
      notifyAdmin(`Assessment baru: ${payload.nama_pengaju} (Rapid Assessment — ${rapidSession.nama_program}).`);
    }
    rapidCount++;
    rapidForm = {};
    toast(`Terkirim (${rapidCount}). Formulir siap untuk penerima berikutnya.`);
    renderRapidBody(shell);
    window.scrollTo(0,0);
  } catch(err){
    console.error(err);
    toast("Gagal mengirim: " + friendlyFirestoreError(err));
    btn.disabled = false;
    btn.textContent = orig;
  }
}

  }
  reviewUnsub = db.collection(COLLECTION).where("session_id","==",sessionId).onSnapshot(snap=>{
    const docs = snap.docs.map(d=>({id:d.id, ...d.data()}));
    if($("#review-pending-list")) renderReviewPendingList(docs.filter(d=>d.status_review === "awaiting_review"));

    const histEl = $("#session-history-list");

      kelayakan: reviewState.kelayakan,
      catatan_petugas: reviewState.catatan || "",

async function submitBatchToAdmin(list){

async function submitSelfFill(shell, sessionId, session){
  if(!selfFillForm.nama || !selfFillForm.nik){ toast("Nama dan NIK wajib diisi."); return; }
  if(!isValidNik(selfFillForm.nik)){ toast("NIK harus tepat 16 digit angka."); return; }
  if(!selfFillForm.telp){ toast("Nomor telepon wajib diisi."); return; }
  if(!isValidPhone(selfFillForm.telp)){ toast("Nomor telepon tidak valid — gunakan angka saja (9-15 digit)."); return; }
  if(sigSelf.isEmpty()){ toast("Mohon bubuhkan tanda tangan Anda."); return; }

  const btn = $("#selffill-submit-btn");
  btn.disabled = true;
  btn.innerHTML = ""; btn.appendChild(el("span",{class:"spinner"})); btn.appendChild(document.createTextNode(" Mengirim..."));

  await ensureAnonAuth();
  const isDup = await checkDuplicateNik(sessionId, selfFillForm.nik);
  if(isDup){
    toast("NIK ini sudah pernah mengisi formulir untuk program ini. Jika ini keliru, hubungi petugas program.");
    btn.disabled = false;
    btn.textContent = "Kirim Data →";
    return;
  }

  const total = parseFloat(selfFillForm.total_penghasilan) || 0;
  const tanggungan = parseFloat(selfFillForm.jumlah_tanggungan) || 1;
  const perCapita = total / Math.max(tanggungan,1);
  const cls = classifyPerCapita(perCapita);

  const payload = {
    ...selfFillForm,
    pendapatan_per_kapita: perCapita,
    kategori_had_kifayah: cls.label,
    nama_pengaju: selfFillForm.nama,
    session_id: sessionId,
    program_nama: session.nama_program,
    program_tgl: session.tgl_pelaksanaan,
    program_lokasi: session.lokasi_penyaluran,
    program_petugas: session.nama_petugas,
    program_telp_petugas: session.telp_petugas,
    program_kategori: session.kategori_program,
    assigned_by: session.assigned_by || null,
    performed_by: session.performed_by || null,
    ttd_pengaju: sigSelf.toDataURL(),
    diisi_oleh: "peserta_sendiri",
    jenis_form: "rapid_assessment",
    status_review: "awaiting_review",
    submittedAt: firebase.firestore.FieldValue.serverTimestamp(),
  };

  try{
    await ensureAnonAuth();
    await db.collection(COLLECTION).add(payload);
    shell.innerHTML = "";
    shell.appendChild(el("div",{class:"success-screen"},
      el("div",{class:"icon"}, "✓"),
      el("h2",{}, "Data Terkirim"),
      el("p",{}, "Terima kasih. Data Anda telah kami terima dan akan ditinjau oleh petugas program."),
    ));
  } catch(err){
    toast("Gagal mengirim: " + friendlyFirestoreError(err));
    btn.disabled = false;
    btn.textContent = "Kirim Data →";
  }
}

    const visibleStatus = snap.docs.map(d=>({ id:d.id, ...d.data() }))

/* ---------------- Filter: Bulan & Kategori Program (opsi dibangun dari data yang ada) ---------------- */
function getSubDate(s){
  if(!s.submittedAt) return null;
  if(typeof s.submittedAt.toDate === "function") return s.submittedAt.toDate();
  const d = new Date(s.submittedAt);
  return isNaN(d) ? null : d;
}
function monthKeyOf(s){
  const d = getSubDate(s);
  if(!d) return "";
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
}
const MONTH_NAMES_ID = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
/* "Kota, Tanggal / Bulan / Tahun" (poin E Rapid Assessment) — otomatis dari Lokasi Penyaluran
   (sesi/program) + tanggal assessment ini disubmit, tidak lagi diketik manual oleh surveyor. */
function formatTanggalIndo(date){
  if(!date) return "-";
  return `${date.getDate()} ${MONTH_NAMES_ID[date.getMonth()]} ${date.getFullYear()}`;
}
function kotaTanggalOtomatis(sub){
  const lokasi = sub.program_lokasi || "-";
  const tgl = formatTanggalIndo(getSubDate(sub));
  return `${lokasi}, ${tgl}`;
}
function monthLabel(key){
  const [y,m] = key.split("-");
  return `${MONTH_NAMES_ID[parseInt(m,10)-1]} ${y}`;
}
/* ---------------- Popup Filter (satu tombol, semua kategori filter di dalamnya) ---------------- */

}
function updateFilterButtonLabel(){

function filterSelectField(label, id, options, currentVal, onChange){

function populateDynamicFilters(){
  const bulanSel = $("#filter-bulan");
  if(bulanSel){
    const months = Array.from(new Set(ALL_SUBMISSIONS.map(monthKeyOf).filter(Boolean))).sort().reverse();
    bulanSel.innerHTML = "";

    months.forEach(m=> bulanSel.appendChild(el("option",{value:m}, monthLabel(m))));
    if(months.includes(ADMIN_FILTERS.bulan)) bulanSel.value = ADMIN_FILTERS.bulan;
  }
  const katSel = $("#filter-kategori");
  if(katSel){
    const kats = Array.from(new Set(ALL_SUBMISSIONS.map(s=>s.program_kategori).filter(Boolean))).sort();
    katSel.innerHTML = "";
    katSel.appendChild(el("option",{value:""},"Semua Kategori Program"));
    kats.forEach(k=> katSel.appendChild(el("option",{value:k}, k)));
    if(kats.includes(ADMIN_FILTERS.kategori)) katSel.value = ADMIN_FILTERS.kategori;
  }
}

/* ---------------- Filter: Lokasi bertingkat (pakai API wilayah yang sama dengan formulir) ---------------- */
function renderLocationFilterFields(){
  const wrap = el("div",{});
  const selProv = wilayahSelect("filter-loc-prov", "Semua Provinsi");
  const selKota = wilayahSelect("filter-loc-kota", "Semua Kota/Kab.");
  const selKec = wilayahSelect("filter-loc-kec", "Semua Kecamatan");
  const selDesa = wilayahSelect("filter-loc-desa", "Semua Desa/Kelurahan");
  [selProv,selKota,selKec,selDesa].forEach(s=>{ s.disabled=false; s.style.width="100%"; s.style.marginBottom="8px"; });

  fetchWilayah("provinces.json").then(list=>{
    resetWilayahSelect(selProv, "Semua Provinsi", false);
    list.forEach(p=> selProv.appendChild(el("option",{value:p.name, "data-id":p.id}, p.name)));
    if(ADMIN_FILTERS.locProv) selProv.value = ADMIN_FILTERS.locProv;
  }).catch(()=> resetWilayahSelect(selProv, "Gagal memuat", true));

  selProv.addEventListener("change", async ()=>{
    ADMIN_FILTERS.locProv = selProv.value; ADMIN_FILTERS.locKota = ""; ADMIN_FILTERS.locKec = ""; ADMIN_FILTERS.locDesa = "";
    resetWilayahSelect(selKota, "Semua Kota/Kab.", false);
    resetWilayahSelect(selKec, "Semua Kecamatan", false);
    resetWilayahSelect(selDesa, "Semua Desa/Kelurahan", false);
    const provId = selProv.selectedOptions[0]?.dataset.id;
    if(provId){
      try{
        const list = await fetchWilayah(`regencies/${provId}.json`);
        list.forEach(r=> selKota.appendChild(el("option",{value:r.name, "data-id":r.id}, r.name)));
      } catch(e){ /* biarkan tetap "Semua Kota/Kab." jika gagal */ }
    }
    updateFilterButtonLabel(); renderTable();
  });
  selKota.addEventListener("change", async ()=>{
    ADMIN_FILTERS.locKota = selKota.value; ADMIN_FILTERS.locKec = ""; ADMIN_FILTERS.locDesa = "";
    resetWilayahSelect(selKec, "Semua Kecamatan", false);
    resetWilayahSelect(selDesa, "Semua Desa/Kelurahan", false);
    const kotaId = selKota.selectedOptions[0]?.dataset.id;
    if(kotaId){
      try{
        const list = await fetchWilayah(`districts/${kotaId}.json`);
        list.forEach(d=> selKec.appendChild(el("option",{value:d.name, "data-id":d.id}, d.name)));
      } catch(e){}
    }
    updateFilterButtonLabel(); renderTable();
  });
  selKec.addEventListener("change", async ()=>{
    ADMIN_FILTERS.locKec = selKec.value; ADMIN_FILTERS.locDesa = "";
    resetWilayahSelect(selDesa, "Semua Desa/Kelurahan", false);
    const kecId = selKec.selectedOptions[0]?.dataset.id;
    if(kecId){
      try{
        const list = await fetchWilayah(`villages/${kecId}.json`);
        list.forEach(v=> selDesa.appendChild(el("option",{value:v.name}, v.name)));
      } catch(e){}
    }
    updateFilterButtonLabel(); renderTable();
  });
  selDesa.addEventListener("change", ()=>{ ADMIN_FILTERS.locDesa = selDesa.value; updateFilterButtonLabel(); renderTable(); });

  wrap.appendChild(selProv); wrap.appendChild(selKota); wrap.appendChild(selKec); wrap.appendChild(selDesa);
  return wrap;
}
function matchesLoc(s, level, name){
  const nameLC = name.toLowerCase();
  const fieldsMap = {
    prov: [s.provinsi, s.alamat_prov],
    kota: [s.kota_kab, s.alamat_kota],
    kec: [s.kecamatan, s.alamat_kec],
    desa: [s.desa_kelurahan, s.alamat_kel],
  };
  return (fieldsMap[level]||[]).some(v=> v && v.toLowerCase().includes(nameLC));
}
function resetFilters(){
  ADMIN_FILTERS = { search:"", jenis:"", status:"", bulan:"", kategori:"", dept:"", locProv:"", locKota:"", locKec:"", locDesa:"" };
  renderFilterPopupBody();
  updateFilterButtonLabel();
  renderTable();
}

async function toggleSettingsPanel(){

        el("div",{class:"eyebrow"}, "Pengaturan"),

      )
    );

      sigPanel.appendChild(el("img",{src:existingSig, style:"max-width:220px;border:1px solid var(--line);border-radius:8px;background:#fff;margin-bottom:14px;display:block;"}));
    }
    const sigBox = el("div",{class:"sig-box"}, el("div",{class:"q"}, existingSig ? "Gambar Ulang Tanda Tangan" : "Buat Tanda Tangan"));
    const pad = createSignaturePad();
    sigBox.appendChild(pad.el);
    sigPanel.appendChild(sigBox);

    // Alternatif: upload file gambar tanda tangan (mis. hasil scan/foto ttd basah) alih-alih
    // menggambar langsung. Gambar diunggah dinormalisasi ke lebar tetap + latar putih (jaga-jaga
    // kalau file PNG-nya transparan) supaya konsisten & tercetak jelas di PDF.
    let uploadedSigDataUrl = null;
    const sigUploadPreview = el("div",{style:"margin-top:10px;"});
    const sigUploadInput = el("input",{type:"file", accept:"image/png,image/jpeg,image/webp", id:"settings-sig-upload"});
    sigUploadInput.addEventListener("change", (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = (ev)=>{
        const img = new Image();
        img.onload = ()=>{
          const maxW = 400;
          const scale = Math.min(1, maxW / img.width);
          const canvas = document.createElement("canvas");
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          const ctx = canvas.getContext("2d");
          ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          uploadedSigDataUrl = canvas.toDataURL("image/png");
          sigUploadPreview.innerHTML = "";
          sigUploadPreview.appendChild(el("div",{class:"hint", style:"margin-bottom:4px;"}, "Pratinjau gambar yang diunggah:"));
          sigUploadPreview.appendChild(el("img",{src: uploadedSigDataUrl, style:"max-width:220px;border:1px solid var(--line);border-radius:8px;background:#fff;display:block;"}));
        };
        img.onerror = ()=> toast("Gagal membaca gambar — pastikan file berformat PNG/JPG/WEBP yang valid.");
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });
    sigPanel.appendChild(el("div",{class:"field-tight", style:"margin-top:14px;"},
      el("label",{}, "Atau Upload Tanda Tangan Digital (gambar)"),
      sigUploadInput,
      sigUploadPreview,
    ));

    sigPanel.appendChild(el("button",{class:"btn btn-primary", style:"margin-top:12px;", onclick: async ()=>{
      const namaVal = $("#settings-nama-input").value.trim();
      const telpVal = $("#settings-telp-input").value.trim();
      if(!namaVal){ toast("Mohon isi Nama Pejabat terlebih dahulu."); return; }
      if(!telpVal || !isValidPhone(telpVal)){ toast("Mohon isi No. Telepon dengan format angka yang benar (9-15 digit)."); return; }
      if(!existingSig && pad.isEmpty() && !uploadedSigDataUrl){ toast("Mohon bubuhkan tanda tangan terlebih dahulu (gambar langsung atau upload file)."); return; }
      try{
        const payload = { nama: namaVal, telp: telpVal, email: auth.currentUser.email, updated_at: firebase.firestore.FieldValue.serverTimestamp() };
        // Prioritas: file yang baru diunggah > gambar tangan yang baru dibuat > (biarkan tanda tangan lama tidak berubah jika tidak ada keduanya).
        if(uploadedSigDataUrl) payload.signature = uploadedSigDataUrl;
        else if(!pad.isEmpty()) payload.signature = pad.toDataURL();
        await db.collection("admin_profiles").doc(auth.currentUser.uid).set(payload, {merge:true});
        if(payload.signature) ADMIN_SIGNATURE = payload.signature;
        ADMIN_NAME = namaVal;
        ADMIN_TELP = telpVal;
        const nameEl = $("#dash-admin-name");
        if(nameEl) nameEl.textContent = `Masuk sebagai ${namaVal} (${auth.currentUser.email})`;
        toast("Pengaturan tersimpan.");
        box.innerHTML = "";
      } catch(err){ toast("Gagal menyimpan: " + friendlyFirestoreError(err)); }
    }}, "Simpan"));
    box.appendChild(sigPanel);
  } catch(err){
    box.innerHTML = "";
    box.appendChild(el("div",{class:"error-box"}, "Gagal memuat pengaturan: " + friendlyFirestoreError(err)));
  }
}

function renderStats(statRow){
  const total = ALL_SUBMISSIONS.length;
  const pending = ALL_SUBMISSIONS.filter(s=>statusOf(s)==="pending").length;
  const approved = ALL_SUBMISSIONS.filter(s=>statusOf(s)==="approved").length;

  statRow.innerHTML = "";
  [
    ["Total Formulir Masuk", total],

    ["Tidak Layak", rejected],
  ].forEach(([label,n])=>{
    statRow.appendChild(el("div",{class:"stat-card"}, el("div",{class:"n mono"}, String(n)), el("div",{class:"l"}, label)));
  });
}

function statusOf(sub){ return sub.admin_status || sub.status_review || "pending"; }

function badgeFor(status){
  const map = {
    pending: ["badge-pending","Menunggu Review"],
    approved: ["badge-approved","Layak Dibantu"],
    attention: ["badge-attention","Perlu Perhatian Khusus"],
    rejected: ["badge-rejected","Tidak Layak"],
  };
  const [cls,label] = map[status] || map.pending;
  return el("span",{class:"badge "+cls}, el("span",{class:"dot"}), label);
}

function getFilteredFlatList(){
  const f = ADMIN_FILTERS;
  const q = (f.search || "").toLowerCase();

  return ALL_SUBMISSIONS.filter(s=>{
    const surveyorName = s.nama_surveyor || s.nama_petugas_ttd || s.program_petugas || "";
    const matchQ = !q || [s.nama_pengaju, s.nik, surveyorName].join(" ").toLowerCase().includes(q);
    const matchStatus = !f.status || statusOf(s) === f.status;
    const matchJenis = !f.jenis || s.jenis_form === f.jenis;
    const matchBulan = !f.bulan || monthKeyOf(s) === f.bulan;
    const matchKategori = !f.kategori || s.program_kategori === f.kategori;
    const matchDept = !f.dept || getDeptAbbrFromEmail(s.assigned_by || s.admin_signed_by) === f.dept;
    const matchProv = !f.locProv || matchesLoc(s,"prov",f.locProv);
    const matchKota = !f.locKota || matchesLoc(s,"kota",f.locKota);
    const matchKec = !f.locKec || matchesLoc(s,"kec",f.locKec);
    const matchDesa = !f.locDesa || matchesLoc(s,"desa",f.locDesa);
    return matchQ && matchStatus && matchJenis && matchBulan && matchKategori && matchDept && matchProv && matchKota && matchKec && matchDesa;
  });
}
/* Kelompokkan hasil submit massal (punya batch_id sama) jadi 1 baris ringkas di tabel,
   supaya 10 data yang dikirim sekaligus tidak memenuhi tabel dengan 10 baris terpisah. */
function groupSubmissions(list){
  const batchIndex = {};
  const rows = [];
  list.forEach(sub=>{
    if(sub.batch_id){
      if(!batchIndex[sub.batch_id]){
        batchIndex[sub.batch_id] = { type:"batch", batch_id: sub.batch_id, subs: [] };
        rows.push(batchIndex[sub.batch_id]);
      }
      batchIndex[sub.batch_id].subs.push(sub);
    } else {
      rows.push({ type:"single", sub });
    }
  });
  return rows;
}
function rowIds(row){ return row.type==="single" ? [row.sub.id] : row.subs.map(s=>s.id); }
function isRowSelected(row){ const ids=rowIds(row); return ids.length>0 && ids.every(id=>SELECTED_IDS.has(id)); }

/* Badge penanda di tabel dashboard: Kepala Divisi lihat DEPARTEMEN (PEM/SOSV/SCH) tiap baris;
   Dept. Head/bawahan lihat SIAPA (dept head atau nama bawahan) yang jadi pemberi tugasnya. */
function computeAssignmentBadge(sub){
  const email = sub.assigned_by || sub.admin_signed_by;
  if(!email || !CURRENT_VIEWER_ROLE){
    return el("span",{class:"hint"}, "Belum ditugaskan");
  }
  if(CURRENT_VIEWER_ROLE.role === "kepala_divisi" || CURRENT_VIEWER_ROLE.role === "super_admin"){
    const abbr = getDeptAbbrFromEmail(email);
    return el("span",{class:"dept-badge"}, abbr || "-");
  }
  const label = getPersonLabelFromEmail(email);
  return el("span",{class:"person-badge", title: email}, label || "-");
}
function renderTable(){
  const tableWrap = $("#table-wrap");
  if(!tableWrap) return;
  updateFilterButtonLabel();
  const flat = getFilteredFlatList();
  const rows = groupSubmissions(flat);
  const badgeColLabel = CURRENT_VIEWER_ROLE && (CURRENT_VIEWER_ROLE.role === "kepala_divisi" || CURRENT_VIEWER_ROLE.role === "super_admin") ? "Departemen" : "Pemberi Tugas";

  tableWrap.innerHTML = "";
  if(rows.length === 0){
    tableWrap.appendChild(el("div",{class:"empty-state"}, el("div",{class:"big"},"🗂️"), "Belum ada data yang cocok."));
    renderBulkActionBar();
    return;
  }

function toggleRowSelect(row, checked){
  rowIds(row).forEach(id=> checked ? SELECTED_IDS.add(id) : SELECTED_IDS.delete(id));

function toggleSelectAllRows(rows, checked){
  rows.forEach(row=> rowIds(row).forEach(id=> checked ? SELECTED_IDS.add(id) : SELECTED_IDS.delete(id)));

}

/* ---------------- Edit Data mentah — khusus Admin Pusat (developer web) ----------------
   Admin Pusat bisa mengedit SELURUH field inputan surveyor secara langsung, apa pun jenis
   formnya (Full/Rapid) — TERMASUK field Pemberi Tugas: assigned_by (siapa yang membagikan
   Link Penugasan — dipakai kalau ada assessment "Belum Ditugaskan" yang sebenarnya sudah
   diketahui pemberi tugasnya, tapi field ini gagal/belum terekam saat surveyor mengisi) dan
   status/email/nama/telp penandatangan (mis. sebelum fitur nama/telp ditambahkan ke kode).
   Nilai berupa teks/angka ditampilkan sbg input biasa; nilai berupa larik/objek (tabel
   dinamis, kategori asnaf, dst) ditampilkan sbg JSON yang bisa disunting. Yang TETAP
   disembunyikan hanya field yang berupa gambar/timestamp (tanda tangan, metadata pengiriman)
   karena tidak praktis/aman disunting sbg teks biasa. */
const EDIT_DATA_SKIP_FIELDS = new Set([
  "id","submittedAt","jenis_form","status_review","session_id",
  "admin_signature","admin_signed_at",
  "ttd_petugas","ttd_pengaju","petugas_signature","batch_id","reviewed_at","reviewed_by",
]);
/* Field Pemberi Tugas SELALU ditampilkan di editor ini meski belum pernah ada sama sekali
   di dokumen (mis. data lama yang direview sebelum fitur nama/telp ditambahkan) — supaya
   Admin Pusat bisa MENAMBAHKAN, bukan cuma mengubah, field yang hilang tsb. */
const EDIT_DATA_ALWAYS_SHOW = ["assigned_by","admin_status","admin_signed_by","admin_signed_by_nama","admin_signed_by_telp"];
function openEditDataDrawer(sub){
  const backdrop = el("div",{class:"drawer-backdrop", onclick:closeDetail});
  const drawer = el("div",{class:"drawer"});
  drawer.appendChild(el("div",{class:"drawer-head"}, el("h3",{}, "Edit Data — " + (sub.nama_pengaju || sub.nama || "-")), el("button",{onclick:closeDetail}, "✕")));
  const body = el("div",{class:"drawer-body"});
  body.appendChild(el("div",{class:"setup-banner"}, "⚠️ Mode Admin Pusat: seluruh field di bawah ini adalah data mentah tersimpan di Firestore. Nilai berupa daftar/tabel ditulis dalam format JSON — pastikan formatnya tetap valid sebelum menyimpan."));

  const inputs = {};
  const keysToShow = Array.from(new Set([...Object.keys(sub), ...EDIT_DATA_ALWAYS_SHOW])).filter(k=>!EDIT_DATA_SKIP_FIELDS.has(k)).sort();
  keysToShow.forEach(key=>{
    const val = sub[key];
    const isComplex = typeof val === "object" && val !== null;
    const displayVal = isComplex ? JSON.stringify(val, null, 2) : (val==null ? "" : String(val));
    const wrap = el("div",{class:"field"});
    wrap.appendChild(el("label",{class:"q"}, key));
    const inputEl = isComplex
      ? Object.assign(el("textarea",{}), {value: displayVal, style:"min-height:90px;font-family:var(--font-mono);font-size:12px;"})
      : el("input",{type:"text", value: displayVal});
    wrap.appendChild(inputEl);
    inputs[key] = { el: inputEl, isComplex };
    body.appendChild(wrap);
  });

  body.appendChild(el("button",{class:"btn btn-primary", style:"width:100%;justify-content:center;margin-top:8px;", onclick: async ()=>{
    const updatePayload = {};
    let hasError = false;
    Object.entries(inputs).forEach(([key, {el:inputEl, isComplex}])=>{
      if(hasError) return;
      const raw = inputEl.value;
      // Field dari EDIT_DATA_ALWAYS_SHOW yang sebelumnya TIDAK ADA sama sekali di dokumen
      // dan dibiarkan kosong (tidak disentuh Admin Pusat) sengaja TIDAK ikut ditulis —
      // supaya tidak menambahkan field baru berisi string kosong yang tidak diinginkan.
      const alreadyExisted = Object.prototype.hasOwnProperty.call(sub, key);
      if(!alreadyExisted && raw.trim() === "") return;
      if(isComplex){
        try{ updatePayload[key] = JSON.parse(raw); }
        catch(e){ hasError = true; toast(`Format JSON tidak valid pada field "${key}".`); }
      } else {
        updatePayload[key] = raw;
      }
    });
    if(hasError) return;
    try{
      await db.collection(COLLECTION).doc(sub.id).update(updatePayload);
      toast("Data berhasil diperbarui oleh Admin Pusat.");
      closeDetail();
    } catch(err){ toast("Gagal menyimpan perubahan: " + friendlyFirestoreError(err)); }
  }}, "Simpan Perubahan"));

  drawer.appendChild(body);
  document.body.appendChild(backdrop);
  document.body.appendChild(drawer);
}
function closeDetail(){
  $$(".drawer-backdrop").forEach(n=>n.remove());
  $$(".drawer").forEach(n=>n.remove());
}
function dsection(title, pairs){
  const grid = el("div",{class:"dgrid"});
  pairs.forEach(([k,v])=>{
    grid.appendChild(el("div",{}, el("div",{class:"k"}, k), el("div",{class:"v"}, (v===undefined||v===null||v==="") ? "—" : String(v))));
  });
  return el("div",{class:"dsection"}, el("h4",{}, title), grid);
}
async function updateStatus(sub, status){
  if(!ADMIN_SIGNATURE){
    toast("Anda belum membuat tanda tangan. Buka ⚙️ Pengaturan → Kontak & Tanda Tangan Saya terlebih dahulu.");
    return;
  }
  try{
    await db.collection(COLLECTION).doc(sub.id).update({
      admin_status: status,
      admin_signature: ADMIN_SIGNATURE,
      admin_signed_by: auth.currentUser ? auth.currentUser.email : "-",
      admin_signed_by_nama: ADMIN_NAME || null,
      admin_signed_by_telp: ADMIN_TELP || null,
      admin_signed_at: firebase.firestore.FieldValue.serverTimestamp(),
    });
    toast("Status diperbarui.");
    closeDetail();
  } catch(err){
    toast("Gagal memperbarui status: " + friendlyFirestoreError(err));
  }
}
async function deleteSubmission(sub){
  const nama = sub.nama_pengaju || sub.nama || "data ini";
  if(!confirm(`Hapus "${nama}" secara PERMANEN dari database? Tindakan ini tidak bisa dibatalkan.`)) return;
  try{
    await db.collection(COLLECTION).doc(sub.id).delete();
    toast("Data berhasil dihapus.");
    closeDetail();
  } catch(err){
    toast("Gagal menghapus data: " + friendlyFirestoreError(err));
  }
}
async function deleteBulk(subs){
  if(!subs.length) return;
  if(!confirm(`Hapus ${subs.length} data terpilih secara PERMANEN dari database? Tindakan ini tidak bisa dibatalkan.`)) return;
  try{
    const batch = db.batch();
    subs.forEach(s=> batch.delete(db.collection(COLLECTION).doc(s.id)));
    await batch.commit();
    SELECTED_IDS.clear();
    toast(`${subs.length} data berhasil dihapus.`);
    renderTable();
  } catch(err){
    toast("Gagal menghapus data secara massal: " + friendlyFirestoreError(err));
  }
}

function pdfAddLogo(doc){
  try{
    const pageW = doc.internal.pageSize.getWidth();
    const size = 15, marginX = 14, marginY = 10;
    doc.addImage(LOGO_RZ_BASE64, "PNG", pageW - marginX - size, marginY, size, size);
  } catch(e){ /* lewati jika logo gagal dimuat */ }
}

function generateAssessmentPDF(sub){
  if(typeof window.jspdf === "undefined"){ toast("Modul PDF gagal dimuat (periksa koneksi internet)."); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  if(sub.jenis_form === "rapid_assessment") drawRapidAssessmentPDF(doc, sub);
  else drawFullAssessmentPDF(doc, sub);
  const kind = sub.jenis_form === "rapid_assessment" ? "rapid-assessment" : "full-assessment";
  const filename = `${kind}-${(sub.nama_pengaju||sub.nama||"data").replace(/\s+/g,"_")}.pdf`;
  // Tampilkan pratinjau dulu di tab baru (pakai viewer PDF bawaan browser, lengkap dengan
  // tombol cetak/unduh sendiri) — tidak langsung memaksa unduh seperti doc.save().
  try{
    const blobUrl = doc.output("bloburl");
    const win = window.open(blobUrl, "_blank");
    if(!win){
      // Pop-up diblokir browser — fallback ke unduh langsung supaya PDF tetap didapat.
      toast("Pop-up pratinjau diblokir browser — PDF diunduh langsung.");
      doc.save(filename);
    }
  } catch(err){
    toast("Gagal membuka pratinjau PDF: " + err.message);
  }
}
/* Aksi massal Admin: SETIAP entri jadi file PDF-nya sendiri (bukan digabung jadi satu PDF
   panjang), lalu dibundel jadi satu file .zip untuk diunduh sekali klik. Catatan: format .rar
   tidak memungkinkan dibuat murni di browser (format tertutup/berbayar, tidak ada encoder
   JS gratis) — .zip adalah standar terbuka yang mencapai tujuan sama persis: tiap assessment
   tetap 1 file PDF terpisah di dalam satu bundel. */
async function generateBulkPDFZip(subs){
  if(typeof window.jspdf === "undefined"){ toast("Modul PDF gagal dimuat (periksa koneksi internet)."); return; }
  if(typeof window.JSZip === "undefined"){ toast("Modul ZIP gagal dimuat (periksa koneksi internet)."); return; }
  if(!subs.length) return;
  const { jsPDF } = window.jspdf;
  const zip = new JSZip();
  const usedNames = {};
  subs.forEach(sub=>{
    const doc = new jsPDF();
    if(sub.jenis_form === "rapid_assessment") drawRapidAssessmentPDF(doc, sub);
    else drawFullAssessmentPDF(doc, sub);
    const kind = sub.jenis_form === "rapid_assessment" ? "rapid-assessment" : "full-assessment";
    let baseName = `${kind}-${(sub.nama_pengaju||sub.nama||"data").replace(/\s+/g,"_")}`;
    let fileName = `${baseName}.pdf`;
    let n = 2;
    while(usedNames[fileName]){ fileName = `${baseName}-${n}.pdf`; n++; } // hindari nama file dobel (nama sama)
    usedNames[fileName] = true;
    zip.file(fileName, doc.output("blob"));
  });
  try{
    const content = await zip.generateAsync({ type:"blob" });
    const url = URL.createObjectURL(content);
    const a = document.createElement("a");
    a.href = url;
    a.download = `assessment-massal-${subs.length}-data-${Date.now()}.zip`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  } catch(err){
    toast("Gagal membuat file ZIP: " + err.message);
  }
}

/* ---------------- PDF Rapid Assessment — mengikuti tata letak form kertas asli ---------------- */
function pdfCheckboxGroup(doc, x, y, maxWidth, items, isCheckedFn){
  const boxSize = 3.3, gapAfterBox = 1.8, itemGap = 7, lineHeight = 6.2;
  doc.setFont("helvetica","normal"); doc.setFontSize(8.7);
  let curX = x, curY = y;
  items.forEach(label=>{
    const textW = doc.getTextWidth(label);
    const itemW = boxSize + gapAfterBox + textW;
    if(curX + itemW > x + maxWidth){ curX = x; curY += lineHeight; }
    const checked = isCheckedFn(label);
    doc.setDrawColor(60,60,60);
    doc.rect(curX, curY - boxSize + 0.8, boxSize, boxSize);
    if(checked){
      doc.setFillColor(...PDF_ORANGE);
      doc.rect(curX+0.5, curY - boxSize + 1.3, boxSize-1, boxSize-1, "F");
      doc.setFillColor(0,0,0);
    }
    doc.setTextColor(20,20,20);
    doc.text(label, curX+boxSize+gapAfterBox, curY);
    curX += itemW + itemGap;
  });
  return curY + lineHeight;
}
function pdfLabel(doc, x, y, text){
  doc.setFont("helvetica","bold"); doc.setFontSize(8.7);
  doc.setTextColor(20,20,20);
  doc.text(text, x, y);
  return y + 4.8;
}
function pdfFieldPair(doc, x, y, colWidth, label1, val1, label2, val2){
  doc.setFont("helvetica","bold"); doc.setFontSize(8.3);
  doc.setTextColor(90,90,90);
  doc.text(label1, x, y);
  if(label2) doc.text(label2, x+colWidth, y);
  doc.setFont("helvetica","normal"); doc.setFontSize(9.5);
  doc.setTextColor(15,15,15);
  doc.text(String(val1==null||val1===""?"-":val1), x, y+4.6);
  if(label2) doc.text(String(val2==null||val2===""?"-":val2), x+colWidth, y+4.6);
  return y + 9.5;
}
function pdfFieldFull(doc, x, y, maxWidth, label, val){
  doc.setFont("helvetica","bold"); doc.setFontSize(8.3);
  doc.setTextColor(90,90,90);
  doc.text(label, x, y);
  doc.setFont("helvetica","normal"); doc.setFontSize(9.5);
  doc.setTextColor(15,15,15);
  const lines = doc.splitTextToSize(String(val==null||val===""?"-":val), maxWidth);
  doc.text(lines, x, y+4.6);
  return y + 4.6 + lines.length*4.6 + 1.5;
}
function pdfSectionHeader(doc, x, y, width, code, title){
  doc.setFillColor(...PDF_ORANGE);
  doc.rect(x, y, width, 6.5, "F");
  doc.setFont("helvetica","bold"); doc.setFontSize(9.5);
  doc.setTextColor(255,255,255);
  doc.text(`${code}. ${title}`, x+3, y+4.6);
  doc.setTextColor(15,15,15);
  return y + 6.5 + 6;
}
/* Render field generik dari skema STEPS (dipakai PDF Full Assessment) — setiap field otomatis
   dirender sesuai tipenya (radio/checkbox jadi kotak centang, teks/tanggal jadi baris label-nilai),
   supaya SELURUH pertanyaan pada formulir pasti ikut tercetak tanpa perlu ditulis ulang manual. */
function pdfRenderFields(doc, x, y, maxWidth, fields, data, ensureSpace){
  fields.forEach(f=>{
    if(f.showIf){
      const v = data[f.showIf];
      const show = f.showIfVal ? v === f.showIfVal : !!v;
      if(!show) return;
    }
    if(f.type === "radio" || f.type === "checkbox"){
      y = ensureSpace(y, 20);
      y = pdfLabel(doc, x, y, f.label + ":");
      const checkFn = f.type === "radio" ? (opt)=> data[f.id]===opt : (opt)=> (data[f.id]||[]).includes(opt);
      y = pdfCheckboxGroup(doc, x, y, maxWidth, f.options, checkFn) + 3;
    } else if(f.type === "checkbox-single"){
      y = ensureSpace(y, 9);
      y = pdfFieldFull(doc, x, y, maxWidth, f.label, data[f.id] ? "Ya" : "Tidak") + 1;
    } else {
      y = ensureSpace(y, 11);
      y = pdfFieldFull(doc, x, y, maxWidth, f.label, data[f.id]) + 1;
    }
  });
  return y;
}
/* Tabel sederhana (dipakai untuk tabel Penghasilan / Pengeluaran / Hutang di PDF Full Assessment). */
function pdfTable(doc, x, y, colWidths, headers, rows, pageBottom){
  const totalW = colWidths.reduce((a,b)=>a+b,0);
  const rowH = 6.2;
  const drawHeader = (yy) => {
    doc.setFillColor(...PDF_ORANGE);
    doc.rect(x, yy, totalW, rowH, "F");
    doc.setFont("helvetica","bold"); doc.setFontSize(7.6);
    doc.setTextColor(255,255,255);
    let cx = x;
    headers.forEach((h,i)=>{ doc.text(h, cx+1.5, yy+4.3); cx += colWidths[i]; });
    doc.setTextColor(15,15,15);
    return yy + rowH;
  };
  y = drawHeader(y);
  if(!rows.length){
    doc.setFont("helvetica","italic"); doc.setFontSize(8);
    doc.setTextColor(140,140,140);
    doc.text("Tidak ada data.", x+2, y+4.3);
    doc.setTextColor(15,15,15);
    return y + rowH + 3;
  }
  doc.setFont("helvetica","normal"); doc.setFontSize(7.6);
  rows.forEach(row=>{
    if(y + rowH > pageBottom){ doc.addPage(); pdfAddLogo(doc); y = 32; y = drawHeader(y); doc.setFont("helvetica","normal"); doc.setFontSize(7.6); }
    doc.setDrawColor(225,225,225);
    doc.rect(x, y, totalW, rowH);
    let cx = x;
    row.forEach((cell,i)=>{
      const txt = String(cell==null||cell===""?"-":cell);
      const lines = doc.splitTextToSize(txt, colWidths[i]-3);
      doc.text(lines[0]||"-", cx+1.5, y+4.3);
      cx += colWidths[i];
    });
    y += rowH;
  });
  return y + 4;
}
/* Label akhir PDF: sebelum admin memberi keputusan masih "Status di Dashboard Admin";
   setelah admin menentukan status (approved/attention/rejected) berganti jadi
   "Rekomendasi Pemberi Tugas" karena sudah merupakan keputusan resmi, bukan status antrian lagi. */
function statusLabelForPDF(sub){
  return sub.admin_status ? "Rekomendasi Pemberi Tugas" : "Status di Dashboard Admin";
}
/* Blok tanda tangan PDF — otomatis 2 atau 3 kolom (kolom ke-3 "Pemberi Tugas" hanya
   diberi gambar tanda tangan jika admin sudah menentukan status assessment ini). */
function pdfSignatureBlock(doc, x, y, width, entries){
  const colW = width / entries.length;
  doc.setDrawColor(200,200,200);
  doc.line(x, y, x+width, y); y += 6;
  doc.setFont("helvetica","bold"); doc.setFontSize(9);
  doc.setTextColor(15,15,15);
  entries.forEach((e,i)=> doc.text(e.label, x+i*colW, y));
  y += 4;
  const sigY = y;
  entries.forEach((e,i)=>{
    if(e.sigDataUrl){ try{ doc.addImage(e.sigDataUrl, "PNG", x+i*colW, sigY, Math.min(colW-6,55), 24); } catch(err){ /* lewati jika gambar tak terbaca */ } }
  });
  y = sigY + 26;
  doc.setFont("helvetica","normal"); doc.setFontSize(8.3);
  doc.setTextColor(60,60,60);
  entries.forEach((e,i)=> doc.text(`( ${e.name || "-"} )`, x+i*colW, y));
  y += 4;
  entries.forEach((e,i)=> doc.text(e.phone ? `(${e.phone})` : "", x+i*colW, y));
  doc.setTextColor(15,15,15);
  return y + 4;
}
