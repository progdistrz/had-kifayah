<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Had Kifayah — Assessment Calon Penerima Manfaat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Firebase (compat SDK, tanpa build tools, cocok untuk single-file GitHub Pages) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-analytics-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  --bg: #FAF7EF;
  --surface: #FFFFFF;
  --surface-sunken: #F3EEE1;
  --ink: #1E2624;
  --ink-muted: #5C6864;
  --ink-faint: #8B958F;
  --line: #E3DDCB;
  --line-strong: #C9C0A6;
  --primary: #EF6F38;
  --primary-dark: #B3532A;
  --primary-tint: #FDEAE0;
  --accent: #C7962C;
  --accent-tint: #F7EDD6;
  --danger: #B3261E;
  --danger-tint: #FBE9E7;
  --warn: #9A6B0B;
  --warn-tint: #FBF0D9;
  --success: #1E7A45;
  --success-tint: #E5F3EA;
  --radius-s: 6px;
  --radius-m: 10px;
  --radius-l: 16px;
  --shadow-card: 0 1px 2px rgba(30,38,36,0.06), 0 8px 24px -12px rgba(30,38,36,0.18);
  --font-display: 'Fraunces', Georgia, serif;
  --font-body: 'Public Sans', -apple-system, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
}

*{ box-sizing: border-box; }
html{ scroll-behavior: smooth; }
body{
  margin:0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
h1,h2,h3,h4{ font-family: var(--font-display); font-weight:600; margin:0; color: var(--primary-dark); }
p{ margin:0; }
button{ font-family: inherit; }
input, select, textarea{ font-family: inherit; font-size: 15px; }
::selection{ background: var(--accent-tint); }
a{ color: var(--primary); }

.mono{ font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* Reduced motion */
@media (prefers-reduced-motion: reduce){
  *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

/* ============================================================
   LAYOUT SHELLS
   ============================================================ */
#app{ min-height:100vh; }
.hidden{ display:none !important; }

.topbar{
  position: sticky; top:0; z-index: 40;
  display:flex; align-items:center; justify-content:space-between;
  padding: 14px 24px;
  background: var(--primary-dark);
  color:#fff;
  border-bottom: 3px solid var(--accent);
}
.topbar .brand{ display:flex; align-items:center; gap:10px; }
.topbar .brand .mark{
  width:34px; height:34px; border-radius:8px;
  background:#fff; padding:4px; object-fit:contain; display:block;
}
.topbar .brand .name{ font-family: var(--font-display); font-weight:600; font-size:17px; letter-spacing:.2px; }
.topbar .brand .sub{ font-size:11px; color: rgba(255,255,255,.65); letter-spacing:.4px; text-transform:uppercase; }
.topbar nav{ display:flex; gap:8px; align-items:center; }
.topbar nav a, .topbar nav button{
  color: rgba(255,255,255,.85); text-decoration:none; font-size:13px;
  background:transparent; border:1px solid rgba(255,255,255,.25); padding:7px 13px; border-radius:999px; cursor:pointer;
}
.topbar nav a:hover, .topbar nav button:hover{ background: rgba(255,255,255,.1); color:#fff; }

.shell{ max-width: 1180px; margin:0 auto; padding: 28px 24px 80px; }

/* ============================================================
   LANDING / ROUTER CHOICE (fallback if hash is empty)
   ============================================================ */
.landing{ max-width: 780px; margin: 60px auto; padding: 0 24px; text-align:center; }
.landing h1{ font-size: 34px; margin-bottom:10px; }
.landing p.lede{ color: var(--ink-muted); font-size:16px; max-width:520px; margin: 0 auto 32px; }
.landing .choices{ display:grid; grid-template-columns: 1fr 1fr; gap:16px; text-align:left; }
.choice-card{
  background: var(--surface); border:1px solid var(--line); border-radius: var(--radius-l);
  padding: 22px; box-shadow: var(--shadow-card); cursor:pointer; text-decoration:none; color: var(--ink);
  transition: transform .15s ease, border-color .15s ease;
}
.choice-card:hover{ transform: translateY(-2px); border-color: var(--primary); }
.choice-card .eyebrow{ font-size:11px; letter-spacing:.6px; text-transform:uppercase; color: var(--accent); font-weight:700; }
.choice-card h3{ font-size:19px; margin: 6px 0 6px; }
.choice-card p{ color: var(--ink-muted); font-size:13.5px; }
.choices-3{ grid-template-columns: 1fr 1fr 1fr; }
.choice-card-disabled{ opacity:.55; cursor:default; }
.choice-card-disabled:hover{ transform:none; border-color: var(--line); }
@media (max-width: 640px){ .landing .choices{ grid-template-columns:1fr; } }
@media (max-width: 880px) and (min-width:641px){ .choices-3{ grid-template-columns: 1fr 1fr; } }

.active-session-banner{
  display:flex; align-items:center; gap:10px; background: var(--accent-tint); border:1px solid #E9D7A6;
  color:#6B4E10; padding:12px 18px; border-radius: var(--radius-m); font-size:13.5px; font-weight:600;
  text-decoration:none; margin-bottom:20px;
}
.active-session-banner:hover{ filter: brightness(.97); }
.dot-pulse{
  width:9px; height:9px; border-radius:50%; background: var(--accent); flex:none;
  animation: dot-pulse-anim 1.6s ease-in-out infinite;
}
@keyframes dot-pulse-anim{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }

/* ============================================================
   WIZARD (Survey Form)
   ============================================================ */
.wizard{ display:grid; grid-template-columns: 240px 1fr; gap: 28px; align-items:start; }
@media (max-width: 880px){ .wizard{ grid-template-columns: 1fr; } }

.rail{
  position: sticky; top: 78px;
  background: var(--surface); border:1px solid var(--line); border-radius: var(--radius-l);
  padding: 18px 14px; box-shadow: var(--shadow-card);
}
.rail-title{ font-size:11px; text-transform:uppercase; letter-spacing:.6px; color: var(--ink-faint); padding: 4px 10px 10px; }
.rail-step{
  display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius: var(--radius-s);
  color: var(--ink-muted); font-size:13px; cursor:pointer; border:none; background:transparent; width:100%; text-align:left;
}
.rail-step .num{
  width:22px; height:22px; border-radius:50%; flex:none;
  border:1.5px solid var(--line-strong); display:flex; align-items:center; justify-content:center;
  font-family: var(--font-mono); font-size:11px; color: var(--ink-faint);
}
.rail-step.active{ background: var(--primary-tint); color: var(--primary-dark); font-weight:600; }
.rail-step.active .num{ border-color: var(--primary); color: var(--primary); background:#fff; }
.rail-step.done .num{ background: var(--success); border-color: var(--success); color:#fff; }
.rail-step.done .num::after{ content:"✓"; }
.rail-step.done .num{ font-size:0; }
.rail-step.done .num::after{ font-size:12px; }

/* Mobile horizontal progress */
.progress-mobile{ display:none; }
@media (max-width: 880px){
  .rail{ display:none; }
  .progress-mobile{
    display:block; position: sticky; top: 64px; z-index:30;
    background: var(--surface); border:1px solid var(--line); border-radius: var(--radius-m);
    padding: 10px 14px; margin-bottom:16px; box-shadow: var(--shadow-card);
  }
  .progress-mobile .bar{ height:6px; background: var(--surface-sunken); border-radius:99px; overflow:hidden; margin-top:8px; }
  .progress-mobile .bar-fill{ height:100%; background: var(--primary); transition: width .25s ease; }
  .progress-mobile .label{ font-size:12px; color: var(--ink-muted); display:flex; justify-content:space-between; }
}

.step-panel{
  background: var(--surface); border:1px solid var(--line); border-radius: var(--radius-l);
  padding: 28px 30px; box-shadow: var(--shadow-card);
}
.step-head{ margin-bottom:22px; padding-bottom:16px; border-bottom:1px solid var(--line); }
.step-head .eyebrow{ font-size:11px; letter-spacing:.6px; text-transform:uppercase; color: var(--accent); font-weight:700; }
.step-head h2{ font-size:23px; margin-top:4px; }
.step-head .desc{ color: var(--ink-muted); font-size:13.5px; margin-top:6px; }

.field{ margin-bottom: 20px; }
.field label.q{ display:block; font-weight:600; font-size:14px; margin-bottom:8px; color: var(--ink); }
.field label.q .req{ color: var(--danger); margin-left:3px; }
.field .hint{ font-size:12px; color: var(--ink-faint); margin-top:5px; }
.field input[type=text], .field input[type=number], .field input[type=tel],
.field input[type=date], .field textarea, .field select{
  width:100%; padding: 10px 12px; border:1.5px solid var(--line-strong); border-radius: var(--radius-s);
  background: #fff; color: var(--ink); transition: border-color .15s ease;
}
.field input:focus, .field select:focus, .field textarea:focus{
  outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-tint);
}
.field textarea{ min-height: 76px; resize: vertical; }
.row2{ display:grid; grid-template-columns: 1fr 1fr; gap:16px; }
.row3{ display:grid; grid-template-columns: 1fr 1fr 1fr; gap:16px; }
.row4{ display:grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap:16px; }
@media (max-width: 640px){ .row2, .row3, .row4{ grid-template-columns:1fr; } }

.options{ display:flex; flex-wrap:wrap; gap:8px; }
.opt{
  display:flex; align-items:center; gap:8px; padding: 9px 14px; border:1.5px solid var(--line-strong);
  border-radius:999px; cursor:pointer; font-size:13.5px; color: var(--ink-muted); background:#fff;
  user-select:none;
}
.opt input{ accent-color: var(--primary); }
.opt.checked{ border-color: var(--primary); background: var(--primary-tint); color: var(--primary-dark); font-weight:600; }
.opt-block{
  display:flex; align-items:flex-start; gap:10px; padding:12px 14px; border:1.5px solid var(--line-strong);
  border-radius: var(--radius-m); cursor:pointer; margin-bottom:8px; background:#fff;
}
.opt-block.checked{ border-color: var(--primary); background: var(--primary-tint); }
.opt-block input{ margin-top:2px; accent-color: var(--primary); }
.opt-block .t{ font-size:14px; font-weight:600; }
.opt-block .d{ font-size:12.5px; color: var(--ink-muted); margin-top:2px; }

fieldset{ border:none; margin:0; padding:0; }

/* Dynamic tables */
.dtable{ width:100%; border-collapse: collapse; margin-top:6px; font-size:13.5px; }
.dtable th{
  text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.4px; color: var(--ink-faint);
  padding: 8px 10px; border-bottom: 1.5px solid var(--line-strong); font-weight:700;
}
.dtable td{ padding: 6px 8px; border-bottom:1px solid var(--line); vertical-align:middle; }
.dtable input, .dtable select{ width:100%; padding:7px 9px; border:1px solid var(--line-strong); border-radius:6px; font-size:13px; }
.dtable .rm{ background:none; border:none; color: var(--danger); cursor:pointer; font-size:16px; padding:4px 8px; }
.dtable tfoot td{ font-weight:700; padding-top:10px; }
.add-row-btn{
  margin-top:8px; background: var(--surface-sunken); border:1.5px dashed var(--line-strong); color: var(--ink-muted);
  padding:8px 14px; border-radius: var(--radius-s); cursor:pointer; font-size:13px; font-weight:600;
}
.add-row-btn:hover{ border-color: var(--primary); color: var(--primary); }

/* Kelayakan calculator — signature element */
.kifayah-gauge{
  margin: 18px 0 26px; border-radius: var(--radius-l); overflow:hidden; border:1px solid var(--line-strong);
  background: linear-gradient(135deg, var(--primary-dark), var(--primary));
  color:#fff; padding: 20px 22px; position:relative;
}
.kifayah-gauge .eyebrow{ font-size:10.5px; text-transform:uppercase; letter-spacing:.6px; color: rgba(255,255,255,.65); font-weight:700; }
.kifayah-gauge .figure{ font-family: var(--font-mono); font-size:30px; font-weight:600; margin:6px 0 4px; letter-spacing:-.5px; }
.kifayah-gauge .figure .cur{ font-size:16px; opacity:.7; margin-right:4px; }
.kifayah-gauge .sub{ font-size:12.5px; color: rgba(255,255,255,.8); }
.kifayah-gauge .badge{
  display:inline-flex; align-items:center; gap:6px; margin-top:12px; padding:6px 13px; border-radius:999px;
  background: rgba(255,255,255,.14); font-size:12.5px; font-weight:600; border:1px solid rgba(255,255,255,.25);
}
.kifayah-gauge .badge .dot{ width:7px; height:7px; border-radius:50%; background: var(--accent); }
.kifayah-gauge .thresholds{ display:flex; gap:14px; margin-top:16px; flex-wrap:wrap; font-size:11px; color: rgba(255,255,255,.55); font-family: var(--font-mono); }
.kifayah-gauge .thresholds span.on{ color:#fff; font-weight:700; }

.asnaf-note{
  background: var(--accent-tint); border:1px solid #E9D7A6; border-radius: var(--radius-m);
  padding:14px 16px; font-size:12.5px; color: #6B4E10; margin-top:10px; line-height:1.6;
}
.asnaf-note b{ display:block; margin-bottom:6px; color:#5A3E08; }
.asnaf-note ul{ margin:0; padding-left:18px; }

/* Step footer nav */
.step-foot{ display:flex; justify-content:space-between; align-items:center; margin-top:28px; padding-top:20px; border-top:1px solid var(--line); }
.btn{
  padding: 11px 22px; border-radius: 999px; font-size:14px; font-weight:600; cursor:pointer; border:1.5px solid transparent;
  display:inline-flex; align-items:center; gap:8px;
}
.btn-primary{ background: var(--primary); color:#fff; }
.btn-primary:hover{ background: var(--primary-dark); }
.btn-ghost{ background:transparent; border-color: var(--line-strong); color: var(--ink-muted); }
.btn-ghost:hover{ border-color: var(--ink-muted); color: var(--ink); }
.btn-accent{ background: var(--accent); color: #4A3608; }
.btn-accent:hover{ filter: brightness(.95); }
.btn[disabled]{ opacity:.45; cursor:not-allowed; }
.btn-danger{ background: var(--danger-tint); color: var(--danger); }

/* Success screen */
.success-screen{ max-width:520px; margin: 70px auto; text-align:center; padding: 0 24px; }
.success-screen .icon{
  width:64px; height:64px; border-radius:50%; background: var(--success-tint); color: var(--success);
  display:flex; align-items:center; justify-content:center; font-size:30px; margin:0 auto 18px;
}
.success-screen h2{ font-size:24px; margin-bottom:8px; }
.success-screen p{ color: var(--ink-muted); font-size:14.5px; margin-bottom:26px; }
.success-screen .ref{ font-family: var(--font-mono); background: var(--surface-sunken); padding:10px 14px; border-radius:8px; display:inline-block; margin-bottom:26px; font-size:13px; }

/* ============================================================
   AUTH (Admin Login)
   ============================================================ */
.auth-wrap{ max-width: 400px; margin: 70px auto; padding: 0 24px; }
.auth-card{ background: var(--surface); border:1px solid var(--line); border-radius: var(--radius-l); padding:32px; box-shadow: var(--shadow-card); }
.auth-card .mark{
  width:44px; height:44px; border-radius:10px; background: var(--primary-tint); padding:7px;
  object-fit:contain; display:block; margin-bottom:16px;
}
.auth-card h2{ font-size:21px; margin-bottom:6px; }
.auth-card .sub{ color: var(--ink-muted); font-size:13.5px; margin-bottom:24px; }
.error-box{ background: var(--danger-tint); color: var(--danger); padding:10px 14px; border-radius:8px; font-size:13px; margin-bottom:16px; }
.field-tight{ margin-bottom:14px; }
.field-tight label{ display:block; font-size:12.5px; font-weight:600; margin-bottom:6px; color: var(--ink-muted); }
.field-tight input{ width:100%; padding:10px 12px; border:1.5px solid var(--line-strong); border-radius: var(--radius-s); }
.field-tight input:focus{ outline:none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-tint); }

/* ============================================================
   ADMIN DASHBOARD
   ============================================================ */
.dash-head{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:20px; flex-wrap:wrap; gap:14px; }
.dash-head h1{ font-size:26px; }
.stat-row{ display:grid; grid-template-columns: repeat(4,1fr); gap:14px; margin-bottom:22px; }
@media (max-width:760px){ .stat-row{ grid-template-columns: 1fr 1fr; } }
.stat-card{ background: var(--surface); border:1px solid var(--line); border-radius: var(--radius-m); padding:16px 18px; }
.stat-card .n{ font-family: var(--font-mono); font-size:26px; font-weight:600; color: var(--primary-dark); }
.stat-card .l{ font-size:12px; color: var(--ink-muted); margin-top:2px; }

.toolbar{ display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; align-items:center; }
.toolbar input[type=search]{
  flex:1; min-width:200px; padding:10px 14px; border:1.5px solid var(--line-strong); border-radius:999px; background:#fff;
}
.toolbar select{ padding:10px 14px; border:1.5px solid var(--line-strong); border-radius:999px; background:#fff; }

.data-table-wrap{ background: var(--surface); border:1px solid var(--line); border-radius: var(--radius-l); overflow:hidden; box-shadow: var(--shadow-card); }
table.data-table{ width:100%; border-collapse:collapse; font-size:13.5px; }
table.data-table th{
  text-align:left; padding:12px 16px; background: var(--surface-sunken); font-size:11px; text-transform:uppercase;
  letter-spacing:.4px; color: var(--ink-faint); border-bottom:1px solid var(--line);
}
table.data-table td{ padding:13px 16px; border-bottom:1px solid var(--line); }
table.data-table tr:last-child td{ border-bottom:none; }
table.data-table tr.rowlink{ cursor:pointer; }
table.data-table tr.rowlink:hover{ background: var(--primary-tint); }
.badge{ display:inline-flex; align-items:center; gap:5px; padding:4px 11px; border-radius:999px; font-size:11.5px; font-weight:700; }
.badge .dot{ width:6px; height:6px; border-radius:50%; }
.badge-pending{ background: var(--warn-tint); color: var(--warn); }
.badge-pending .dot{ background: var(--warn); }
.badge-approved{ background: var(--success-tint); color: var(--success); }
.badge-approved .dot{ background: var(--success); }
.badge-rejected{ background: var(--danger-tint); color: var(--danger); }
.badge-rejected .dot{ background: var(--danger); }
.badge-attention{ background: var(--accent-tint); color:#6B4E10; }
.badge-attention .dot{ background: var(--accent); }
.empty-state{ text-align:center; padding: 60px 20px; color: var(--ink-muted); }
.empty-state .big{ font-size:38px; margin-bottom:12px; }

/* Detail drawer */
.drawer-backdrop{ position:fixed; inset:0; background: rgba(20,26,24,.45); z-index:60; }
.drawer{
  position:fixed; top:0; right:0; bottom:0; width: min(640px, 100%); background: var(--bg); z-index:61;
  overflow-y:auto; box-shadow: -8px 0 30px rgba(0,0,0,.2);
}
.drawer-head{ position:sticky; top:0; background: var(--primary-dark); color:#fff; padding:18px 24px; display:flex; justify-content:space-between; align-items:center; z-index:2; }
.drawer-head h3{ color:#fff; font-size:18px; }
.drawer-head button{ background: rgba(255,255,255,.15); border:none; color:#fff; width:30px; height:30px; border-radius:50%; cursor:pointer; font-size:15px; }
.drawer-body{ padding: 22px 24px 60px; }
.dsection{ background: var(--surface); border:1px solid var(--line); border-radius: var(--radius-m); padding:16px 18px; margin-bottom:14px; }
.dsection h4{ font-size:13px; text-transform:uppercase; letter-spacing:.4px; color: var(--accent); margin-bottom:12px; }
.dgrid{ display:grid; grid-template-columns: 1fr 1fr; gap:10px 18px; }
.dgrid .k{ font-size:11.5px; color: var(--ink-faint); }
.dgrid .v{ font-size:13.5px; font-weight:600; margin-top:1px; }
@media (max-width:520px){ .dgrid{ grid-template-columns: 1fr; } }
.admin-action-bar{ display:flex; gap:10px; flex-wrap:wrap; margin-top:6px; }

.setup-banner{
  background: var(--warn-tint); border:1px solid #E9D08A; color:#6B4E10; padding:14px 18px; border-radius: var(--radius-m);
  font-size:13px; margin-bottom:20px; line-height:1.6;
}
.setup-banner code{ background: rgba(0,0,0,.06); padding:1px 6px; border-radius:4px; font-family: var(--font-mono); font-size:12px; }

.spinner{ width:18px; height:18px; border-radius:50%; border:2.5px solid rgba(255,255,255,.4); border-top-color:#fff; animation: spin .7s linear infinite; display:inline-block; }
@keyframes spin{ to{ transform: rotate(360deg); } }
.toast{
  position:fixed; bottom:22px; left:50%; transform: translateX(-50%); background: var(--ink); color:#fff;
  padding:12px 20px; border-radius:999px; font-size:13.5px; z-index:100; box-shadow: 0 8px 24px rgba(0,0,0,.25);
}

/* ============================================================
   RAPID ASSESSMENT
   ============================================================ */
.rapid-head{ margin-bottom:18px; }
.session-counter{
  display:inline-flex; align-items:center; gap:7px; background: var(--success-tint); color: var(--success);
  font-size:12.5px; font-weight:700; padding:6px 13px; border-radius:999px; margin-bottom:16px;
}
.program-bar{
  display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap;
  background: var(--primary-tint); border:1px solid #CFE1D7; border-radius: var(--radius-l); padding:16px 20px; margin-bottom:20px;
}
.program-bar-label{ font-size:11px; text-transform:uppercase; letter-spacing:.4px; color: var(--primary-dark); font-weight:700; margin-bottom:8px; }
.program-bar-grid{ display:flex; gap:22px; flex-wrap:wrap; }
.program-chip .k{ font-size:11px; color: var(--ink-faint); }
.program-chip .v{ font-size:13.5px; font-weight:600; color: var(--ink); margin-top:1px; }
.rapid-section-head{ display:flex; align-items:center; gap:12px; margin: 28px 0 16px; }
.rapid-section-head:first-child{ margin-top:0; }
.rapid-section-letter{
  width:30px; height:30px; border-radius:50%; background: var(--primary); color:#fff; flex:none;

}
.rapid-section-head h3{ font-size:16px; color: var(--primary-dark); }
.sig-box{ background: var(--surface-sunken); border:1px solid var(--line); border-radius: var(--radius-m); padding:16px; }
.sigpad-wrap{ margin-top:10px; }
.sigpad-canvas{
  display:block; width:100%; max-width:320px; height:140px; background:#fff; border:1.5px dashed var(--line-strong);
  border-radius: var(--radius-s); touch-action:none; cursor: crosshair;
}
.sigpad-controls{ display:flex; justify-content:space-between; align-items:center; margin-top:6px; }
.sigpad-hint{ font-size:11.5px; color: var(--ink-faint); }
.sigpad-clear{ background:none; border:none; color: var(--danger); font-size:12px; cursor:pointer; font-weight:600; }
.inline-btn{ background:none; border:none; color: var(--primary); font-size:12px; font-weight:600; cursor:pointer; padding:0; margin-top:6px; }

/* Tahap 2: pilihan cara pengisian — dua kartu persegi berdampingan */
.mode-choices{ display:grid; grid-template-columns: 1fr 1fr; gap:20px; margin-top:8px; max-width:620px; }
.mode-card{
  aspect-ratio: 1 / 1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; background:#fff; border:2px solid var(--line-strong); border-radius: var(--radius-l);
  padding:22px; cursor:pointer; font-family:inherit; color:inherit;
  transition: border-color .15s ease, transform .15s ease, box-shadow .15s ease;
}
.mode-card:hover{ border-color: var(--primary); transform: translateY(-3px); box-shadow: var(--shadow-card); }
.mode-card:focus-visible{ outline:2px solid var(--primary); outline-offset:2px; }
.mode-card-icon{ font-size:38px; margin-bottom:14px; line-height:1; }
.mode-card h3{ font-size:15.5px; margin-bottom:8px; }
.mode-card p{ font-size:12.5px; color: var(--ink-muted); line-height:1.5; }
@media (max-width:560px){
  .mode-choices{ grid-template-columns:1fr; max-width:340px; margin-left:auto; margin-right:auto; }
  .mode-card{ aspect-ratio:auto; padding:26px 20px; }
}

/* Link mode: kotak salin link, daftar review & riwayat */

<div id="app"></div>

<script>
/* ================================================================
   FIREBASE CONFIG
   ----------------------------------------------------------------
   Project: had-kifayah (sudah diisi di bawah).

   Checklist yang MASIH perlu disiapkan di Firebase Console
   (console.firebase.google.com > project "had-kifayah") sebelum
   semua fitur (login admin, sesi Rapid Assessment, link mandiri,
   notifikasi email) benar-benar berfungsi:

   1. Authentication > Sign-in method > aktifkan "Email/Password"
      (untuk Admin) DAN "Anonymous" (dipakai diam-diam oleh
      Surveyor & calon peserta agar Firestore Rules bisa dibatasi
      tanpa mewajibkan mereka login). Buat 1 akun admin manual di
      Authentication > Users > Add user.
   2. Firestore Database > buat database jika belum ada (mode
      production, region terdekat mis. asia-southeast2).
   3. Firestore > Rules, gunakan aturan berikut:

      rules_version = '2';
      service cloud.firestore {
        // Anonim (surveyor/calon peserta) dicek dengan AMAN: field "email" pada token bisa saja
        // sama sekali tidak ada (bukan cuma null) untuk akun anonymous — cek keberadaan key dulu
        // baru nilainya, supaya tidak pernah gagal/error saat dievaluasi Firestore.
        function isRealAdmin() {
          return "email" in request.auth.token && request.auth.token.email != null;
        }
        // "Antrian terbuka" = belum ditugaskan lewat Link Tugas siapa pun (assigned_by) DAN
        // belum direview siapa pun (admin_status). PENTING: field ini SELALU disimpan oleh
        // aplikasi meski nilainya null (bukan dihilangkan) — jadi di sini juga wajib dicek
        // NILAINYA (== null), bukan cuma keberadaan key-nya, supaya cocok dgn perilaku
        // isOpenQueueItem() di index.html (yang pakai !s.assigned_by, otomatis anggap
        // null/undefined sama-sama "kosong").
        function isOpenQueue(data) {
          return (!("assigned_by" in data) || data.assigned_by == null) &&
                 (!("admin_status" in data) || data.admin_status == null);
        }
        // HARUS SAMA PERSIS dengan getVisibleSubmissionsForRole() di index.html.
        // Begitu assigned_by SUDAH terisi, itu jadi SATU-SATUNYA penentu departemen pemilik
        // (mengabaikan admin_signed_by dari dept lain) — supaya item yang sudah ditugaskan
        // tidak lagi ikut terlihat oleh dept yang bukan pemiliknya.
        function deptCanSee(data, deptEmails) {
          return isOpenQueue(data) ||
            (("assigned_by" in data) && data.assigned_by != null
              ? data.assigned_by in deptEmails
              : (("admin_status" in data) && data.admin_status != null &&
                  ("admin_signed_by" in data) && data.admin_signed_by != null && data.admin_signed_by in deptEmails));
        }
        match /databases/{database}/documents {
          match /rapid_sessions/{sessionId} {
            allow read, create: if request.auth != null; // termasuk anonymous
          }
          match /assessments/{docId} {
            allow create, update: if request.auth != null; // termasuk anonymous (surveyor & calon peserta)
            // Baca dibatasi per hirarki jabatan (harus SAMA PERSIS dengan ROLE_HIERARCHY di index.html):
            // - anonim (surveyor/calon peserta, token tanpa email) tetap boleh baca seperti sebelumnya
            //   (dipakai fitur Riwayat/Daftar Review milik surveyor).
            // - progdist@admin.erzet (Admin Pusat/developer) & admin@progdist.erzet (Kepala Divisi): baca semua.
            // - performed_by == email saya sendiri: pejabat yg SECARA PRIBADI mengisi lewat
            //   tombol "Lakukan Assessment Sendiri" selalu boleh baca hasil kerjanya sendiri,
            //   walau assigned_by mengarah ke atasannya (bukan dirinya).
            // - dept head + 2 bawahannya: baca dokumen "antrian terbuka", ATAU yang assigned_by
            //   (ditugaskan lewat Link Tugas) / admin_signed_by (sudah direview) berasal dari
            //   salah satu email dalam dept yang sama.
            allow read: if request.auth != null && (
              !isRealAdmin() ||
              request.auth.token.email == "progdist@admin.erzet" ||
              request.auth.token.email == "admin@progdist.erzet" ||
              (("performed_by" in resource.data) && resource.data.performed_by != null && resource.data.performed_by == request.auth.token.email) ||
              (request.auth.token.email in ["sosv@progdist.erzet","prcb@progdist.erzet","sosv.admin@progdist.erzet"] &&
                deptCanSee(resource.data, ["sosv@progdist.erzet","prcb@progdist.erzet","sosv.admin@progdist.erzet"])) ||
              (request.auth.token.email in ["sch@progdist.erzet","iis@progdist.erzet","diki@progdist.erzet"] &&
                deptCanSee(resource.data, ["sch@progdist.erzet","iis@progdist.erzet","diki@progdist.erzet"])) ||
              (request.auth.token.email in ["pem@progdist.erzet","mujib@progdist.erzet","rafi@progdist.erzet"] &&
                deptCanSee(resource.data, ["pem@progdist.erzet","mujib@progdist.erzet","rafi@progdist.erzet"]))
            );
            allow delete: if request.auth != null && isRealAdmin(); // khusus admin
          }
          match /app_settings/{docId} {
            allow read: if request.auth != null;
            allow write: if request.auth != null && isRealAdmin(); // khusus admin
          }
          match /mail/{docId} {
            allow create: if request.auth != null;
            allow read, update, delete: if false; // hanya ekstensi Trigger Email yang mengelola
          }
          match /admin_profiles/{uid} {
            // Tanda tangan admin (Pemberi Tugas) — tiap admin hanya boleh baca/tulis profilnya
            // sendiri (uid dokumen harus cocok dengan uid akun yang sedang login), dan wajib
            // login email asli (bukan anonymous).
            allow read, write: if request.auth != null && request.auth.uid == uid && isRealAdmin();
          }
        }
      }

   4. (Opsional, untuk notifikasi email ke Admin) Firebase Console >
      Extensions > pasang ekstensi resmi "Trigger Email from
      Firestore" (Firebase/firestore-send-email). Saat instalasi,
      set nama koleksi ke "mail" dan isi kredensial SMTP pengirim.
      Perlu paket Blaze (pay-as-you-go), namun volume rendah biasanya
      tetap gratis. Lalu buka Dashboard Admin > "⚙️ Pengaturan
      Notifikasi" untuk mengisi alamat email tujuan.
================================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyB2Nha_gJ2DF4h360mPSAvnaf0jwS_KWNo",
  authDomain: "had-kifayah.firebaseapp.com",
  projectId: "had-kifayah",
  storageBucket: "had-kifayah.firebasestorage.app",
  messagingSenderId: "594684141648",
  appId: "1:594684141648:web:03b63181ba28aeb4843155",
  measurementId: "G-TLTRKYBVJK"
};

let FIREBASE_NOT_CONFIGURED = firebaseConfig.apiKey.startsWith("GANTI");
let auth = null, db = null;
if(!FIREBASE_NOT_CONFIGURED){
  try{
    if(typeof firebase === "undefined") throw new Error("SDK Firebase gagal dimuat (periksa koneksi internet / pemblokir iklan).");
    firebase.initializeApp(firebaseConfig);
    auth = firebase.auth();
    db = firebase.firestore();
    try{ firebase.analytics(); } catch(e){ /* analytics opsional, abaikan jika gagal (mis. diblokir adblock) */ }
  } catch(e){
    console.error("Inisialisasi Firebase gagal, aplikasi berjalan dalam mode pratinjau (data tidak tersimpan):", e);
    FIREBASE_NOT_CONFIGURED = true;
    auth = null; db = null;
  }
}
/* Satu koleksi Firestore untuk seluruh jenis form (dibedakan lewat field
   "jenis_form"): full_assessment, rapid_assessment, community_development.
   Dashboard admin membaca semuanya dan memfilter per jenis lewat tab. */
const COLLECTION = "assessments";

/* ================================================================
   HIRARKI AKSES DASHBOARD ADMIN
   ----------------------------------------------------------------
   Didaftarkan manual sesuai struktur organisasi. Tiga peran:
   - "kepala_divisi": melihat SELURUH assessment yang masuk.
   - "dept_head": melihat assessment miliknya sendiri + milik 2 bawahannya
     (dicocokkan lewat field admin_signed_by — siapa yang menandatangani
     sebagai Pemberi Tugas).
   - "subordinate": HANYA melihat assessment yang sudah dia sendiri
     tentukan statusnya (tanda tangani sebagai Pemberi Tugas).
   Assessment yang BELUM ditentukan statusnya siapa pun (admin_status
   belum ada) tetap terlihat oleh seluruh peran di hirarki ini, supaya
   ada yang bisa mengambil & mereview — begitu salah satu bawahan
   menentukan statusnya, assessment itu "menjadi miliknya" untuk tujuan
   visibilitas (bawahan lain & dept lain tidak lagi melihatnya, kecuali
   dept head/kepala divisi terkait).

   PENTING: aturan yang SAMA PERSIS juga harus dipasang di Firestore
   Security Rules (lihat komentar "FIREBASE CONFIG" di bawah) supaya
   pembatasan ini benar-benar ditegakkan di server — filter di sini
   hanya mengatur tampilan, bukan proteksi sesungguhnya. */
/* Nomor telepon & nama TIDAK diisi manual di sini lagi — tiap pemilik akun mengisi
   nama, no. telepon, dan tanda tangannya sendiri lewat ⚙️ Pengaturan → "Kontak & Tanda
   Tangan Saya" (tersimpan per akun di koleksi admin_profiles). "nama" di bawah ini
   hanya dipakai sbg fallback singkat untuk Kepala Dept sebelum mereka mengisi sendiri. */
const ROLE_HIERARCHY = {
  "progdist@admin.erzet": { role:"super_admin", nama:"Admin Pusat" },
  "admin@progdist.erzet": { role:"kepala_divisi", nama:"Kepala Divisi" },
  "sosv@progdist.erzet": { role:"dept_head", dept:"Dept. Sosv", nama:"US", subordinates:["prcb@progdist.erzet","sosv.admin@progdist.erzet"] },
  "sch@progdist.erzet": { role:"dept_head", dept:"Dept. Sch", nama:"SN", subordinates:["iis@progdist.erzet","diki@progdist.erzet"] },
  "pem@progdist.erzet": { role:"dept_head", dept:"Dept. PEM", nama:"BK", subordinates:["mujib@progdist.erzet","rafi@progdist.erzet"] },
  "prcb@progdist.erzet": { role:"subordinate", dept:"Dept. Sosv" },
  "sosv.admin@progdist.erzet": { role:"subordinate", dept:"Dept. Sosv" },
  "iis@progdist.erzet": { role:"subordinate", dept:"Dept. Sch" },
  "diki@progdist.erzet": { role:"subordinate", dept:"Dept. Sch" },
  "mujib@progdist.erzet": { role:"subordinate", dept:"Dept. PEM" },
  "rafi@progdist.erzet": { role:"subordinate", dept:"Dept. PEM" },
};
function getRoleInfo(email){
  if(!email) return null;
  return ROLE_HIERARCHY[email.toLowerCase()] || null;
}
/* Kalau seorang pejabat/bawahan melakukan assessment SENDIRI lewat tombol di dashboardnya
   (bukan lewat Link Penugasan biasa), pemberi tugasnya otomatis mengikuti struktur organisasi:
   - Bawahan (mis. PRCB) -> pemberi tugas = Kepala Dept-nya (mis. SOSV), BUKAN dirinya sendiri.
   - Kepala Dept (mis. SOSV) -> pemberi tugas = dirinya sendiri (tidak ada dept head di atasnya).
   - Kepala Divisi -> null (tidak perlu pemberi tugas sama sekali, karena top leader). Route
     Full/Rapid Assessment mengizinkan akses tanpa ASSIGNED_BY khusus untuk kasus ini (lihat
     renderSurveyPage/renderRapidPage). */
function computeSelfAssignedBy(email){
  const info = getRoleInfo(email);
  if(!info) return null;
  if(info.role === "kepala_divisi") return null;
  if(info.role === "dept_head"){
    // Kembalikan key kanonis (huruf kecil) dari ROLE_HIERARCHY, bukan email mentah dari akun
    // login (bisa saja beda kapitalisasi), supaya konsisten dgn nilai assigned_by di tempat lain.
    const entry = Object.entries(ROLE_HIERARCHY).find(([e,i])=> e === email.toLowerCase() && i.role === "dept_head");
    return entry ? entry[0] : email.toLowerCase();
  }
  if(info.role === "subordinate"){
    const deptHeadEntry = Object.entries(ROLE_HIERARCHY).find(([e,i])=>
      i.role === "dept_head" && (i.subordinates||[]).map(s=>s.toLowerCase()).includes(email.toLowerCase())
    );
    return deptHeadEntry ? deptHeadEntry[0] : null;
  }
  return null;
}
/* Label singkat departemen dari email ("Dept. Sosv" -> "SOSV") — dipakai penanda di
   dashboard Kepala Divisi supaya bisa membedakan asal tiap baris sekilas pandang. */
function getDeptAbbrFromEmail(email){
  const info = getRoleInfo(email);
  if(!info) return null;
  if(info.role === "kepala_divisi") return "PROGDIST";
  if(info.role === "super_admin") return "ADMIN PUSAT";
  const m = (info.dept || "").match(/Dept\.?\s*(\S+)/i);
  return m ? m[1].toUpperCase() : (info.dept || null);
}
/* Label singkat orangnya ("prcb@progdist.erzet" -> "prcb") — dipakai penanda di dashboard
   Dept. Head/bawahan supaya bisa membedakan siapa pemberi tugas tiap baris. */
function getPersonLabelFromEmail(email){
  if(!email) return null;
  const info = getRoleInfo(email);
  if(!info) return email.split("@")[0];
  if(info.role === "dept_head" && info.nama) return info.nama;
  // Kalau item ternyata dari Kepala Divisi/Admin Pusat (bukan dept_head biasa), tampilkan
  // label departemen singkatnya (PROGDIST/ADMIN PUSAT) — bukan potongan mentah emailnya.
  if(info.role === "kepala_divisi" || info.role === "super_admin") return getDeptAbbrFromEmail(email);
  return email.split("@")[0];
}
/* Item "antrian terbuka" — belum ditugaskan lewat Link Tugas siapa pun, dan belum direview
   siapa pun — tetap terlihat oleh semua orang di hirarki supaya ada yang bisa mengambilnya. */
function isOpenQueueItem(s){
  return !s.assigned_by && !s.admin_status;
}
function getVisibleSubmissionsForRole(list, email){
  const info = getRoleInfo(email);
  if(!info) return [];
  // Admin Pusat (developer web) & Kepala Divisi sama-sama melihat SELURUH assessment.
  if(info.role === "kepala_divisi" || info.role === "super_admin") return list;
  const allowed = info.role === "dept_head"
    ? new Set([...info.subordinates.map(s=>s.toLowerCase()), email.toLowerCase()])
    : new Set([email.toLowerCase()]);
  return list.filter(s=>{
    if(isOpenQueueItem(s)) return true;
    // "performed_by" = pejabat yang SECARA PRIBADI turun ke lapangan mengisi lewat tombol
    // "Lakukan Assessment Sendiri" di dashboard. Ini dicek TERPISAH dari assigned_by supaya
    // hasil kerjanya tetap terlihat di dashboard pejabat itu SENDIRI (privasi antar-bawahan
    // tetap terjaga: performed_by hanya cocok utk emailnya sendiri, bukan seluruh dept).
    if(s.performed_by && allowed.has(s.performed_by.toLowerCase())) return true;
    // Begitu assigned_by SUDAH terisi, itu jadi SATU-SATUNYA penentu departemen "pemilik"
    // item ini — mengabaikan admin_signed_by lama dari dept lain (mis. dari pengujian
    // sebelum assigned_by diperbaiki manual oleh Admin Pusat), supaya item yang sudah
    // ditugaskan tidak lagi "nyangkut" terlihat di dept yang bukan pemiliknya.
    if(s.assigned_by) return allowed.has(s.assigned_by.toLowerCase());
    const reviewedByMe = s.admin_status && s.admin_signed_by && allowed.has(s.admin_signed_by.toLowerCase());
    return reviewedByMe;
  });
}

/* ================================================================
   LINK TUGAS — pejabat/bawahan membagikan link pribadi ke surveyor.
   ----------------------------------------------------------------
   Formulir apa pun (Full/Rapid/CommDev) yang diisi lewat link ini
   otomatis "terikat" ke pemberi tugas (field assigned_by), sehingga
   langsung muncul di dashboard pemberi tugas + atasannya (tanpa
   menunggu direview), dan TIDAK muncul di dept lain. Diagnosis
   visibilitasnya ditentukan getVisibleSubmissionsForRole() di atas. */
let ASSIGNED_BY = null;
const ASSIGNED_BY_STORAGE_KEY = "had_kifayah_assigned_by";
function saveAssignedByRef(email){
  try{ localStorage.setItem(ASSIGNED_BY_STORAGE_KEY, email); } catch(e){ /* abaikan */ }
}
function loadAssignedByRef(){
  try{ return localStorage.getItem(ASSIGNED_BY_STORAGE_KEY); } catch(e){ return null; }
}
function clearAssignedByRef(){
  try{ localStorage.removeItem(ASSIGNED_BY_STORAGE_KEY); } catch(e){ /* abaikan */ }
  ASSIGNED_BY = null;
}

/* ================================================================
   UTIL
   ================================================================ */
const $ = (sel, el=document) => el.querySelector(sel);
const $$ = (sel, el=document) => Array.from(el.querySelectorAll(sel));
const el = (tag, attrs={}, ...children) => {
  const n = document.createElement(tag);
  for(const k in attrs){
    if(attrs[k] == null){ continue; } // jangan setAttribute(k, null) -> browser membacanya sbg string "null"
    if(k === "class") n.className = attrs[k];
    else if(k === "html") n.innerHTML = attrs[k];
    else if(k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
    else n.setAttribute(k, attrs[k]);
  }
  children.flat().forEach(c=>{
    if(c==null) return;
    n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return n;
};
const fmtRupiah = (n) => "Rp " + (Math.round(n||0)).toLocaleString("id-ID");

/* Firestore melempar pesan generik "Missing or insufficient permissions"
   untuk hampir semua kegagalan Security Rules — kita perjelas dengan
   petunjuk perbaikan langsung di pesan errornya. */
function friendlyFirestoreError(err){
  const raw = (err && err.message) || String(err);
  if(err && (err.code === "permission-denied" || /permission/i.test(raw))){
    return "Izin ditolak oleh Firestore. Periksa 2 hal: (1) Authentication → Sign-in method → \"Anonymous\" harus AKTIF, (2) Firestore → Rules harus sudah dipublikasikan sesuai contoh di komentar awal index.html (cari \"FIREBASE CONFIG\"). Pesan asli: " + raw;
  }
  return raw;
}
/* Format ribuan "500000" -> "500.000". Dipakai live saat mengetik nominal. */
function formatRibuanDigits(digits){
  if(!digits) return "";
  return digits.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
}
/* Input nominal dengan bantuan titik ribuan otomatis saat mengetik (mis. "500000" -> "500.000").
   Nilai yang disimpan lewat onChange tetap digit murni, supaya perhitungan (parseFloat) tidak berubah. */
function moneyInput(value, onChange){
  const inp = el("input",{type:"text", inputmode:"numeric", value: formatRibuanDigits(String(value||"").replace(/\D/g,""))});
  inp.addEventListener("input", ()=>{
    const digits = inp.value.replace(/\D/g,"");
    inp.value = formatRibuanDigits(digits);
    onChange(digits);
  });
  return inp;
}
function isValidNik(nik){ return /^\d{16}$/.test(nik || ""); }
function isValidPhone(phone){ return /^\+?[0-9]{9,15}$/.test(phone || ""); }
/* Cegah calon peserta mengisi lebih dari 1x untuk program/sesi yang sama (berdasarkan NIK). */
async function checkDuplicateNik(sessionId, nik){
  if(FIREBASE_NOT_CONFIGURED || !sessionId || !nik) return false;
  try{
    const snap = await db.collection(COLLECTION).where("session_id","==",sessionId).where("nik","==",nik).limit(1).get();
    return !snap.empty;
  } catch(e){ console.warn("Gagal memeriksa duplikasi NIK:", e); return false; }
}
function toast(msg){

}

   tombol "Lakukan Assessment Sendiri" di dashboard, identitas Nama/No.Telp/Tanda Tangan
   Surveyor otomatis memakai data profil mereka sendiri (ADMIN_NAME/ADMIN_TELP/ADMIN_SIGNATURE,
   sudah dimuat sejak dashboard dibuka) — tidak perlu diketik/digambar ulang. Admin Pusat
   dikecualikan karena bukan bagian struktur pejabat yang turun ke lapangan. */
function getSelfAssessmentIdentity(){
  if(!auth || !auth.currentUser || auth.currentUser.isAnonymous) return null;
  const info = getRoleInfo(auth.currentUser.email);
  if(!info || info.role === "super_admin") return null;
  return { email: auth.currentUser.email.toLowerCase(), nama: ADMIN_NAME, telp: ADMIN_TELP, signature: ADMIN_SIGNATURE };
}

  // isAdmin: true = tampil "Keluar" (sudah login di dashboard admin), false = tampil "Beranda" saja,
  // "public" = tanpa navigasi sama sekali (link mandiri utk calon peserta).
  const nav = isAdmin === "public" ? null : el("nav",{},
    el("a",{href:"#/"}, "Beranda"),
    isAdmin===true ? el("button",{onclick:doLogout}, "Keluar") : null
  );
  return el("div",{class:"topbar"},
    el("div",{class:"brand"},
      el("img",{class:"mark", src: LOGO_RZ_BASE64, alt:"Rumah Zakat"}),
      el("div",{},
        el("div",{class:"name"}, "Had Kifayah"),
        el("div",{class:"sub"}, "Rumah Zakat"),
      )
    ),
    nav
  );
}

function renderWizard(body){
  body.innerHTML = "";
  if(currentStepIndex >= STEPS.length){
    renderSuccessScreen(body);
    return;
  }
  const step = STEPS[currentStepIndex];

  // Panduan Asnaf disarankan otomatis begitu surveyor pertama kali sampai ke langkah Resume
  // (berdasarkan jawaban sebelumnya) — hanya sekali, supaya tidak menimpa penyesuaian manual
  // surveyor jika mereka kembali ke langkah ini.
  if(step.key === "resume" && !formState._asnaf_auto_applied){
    formState.asnaf = computeAsnafFull();
    formState._asnaf_auto_applied = true;
  }

  const railEl = el("div",{class:"rail"},
    el("div",{class:"rail-title"}, "Tahapan Formulir"),
    ...STEPS.map((s,i)=> el("button",{
        class:"rail-step" + (i===currentStepIndex?" active":"") + (i<currentStepIndex?" done":""),
        onclick:()=>{ if(i<currentStepIndex){ currentStepIndex=i; renderWizard(body); } }
      },
      el("span",{class:"num"}, String(i+1).padStart(2,"0")),
      el("span",{}, s.title)
    ))
  );

  const progressMobile = el("div",{class:"progress-mobile"},
    el("div",{class:"label"}, el("span",{}, `Langkah ${currentStepIndex+1} dari ${STEPS.length}`), el("span",{}, step.title)),
    el("div",{class:"bar"}, el("div",{class:"bar-fill", style:`width:${((currentStepIndex)/(STEPS.length-1))*100}%`}))
  );

  const panel = el("div",{class:"step-panel"},
    el("div",{class:"step-head"},
      el("div",{class:"eyebrow"}, `Langkah ${currentStepIndex+1} dari ${STEPS.length}`),
      el("h2",{}, step.title),
      el("div",{class:"desc"}, step.desc)
    )
  );

  const form = el("div",{class:"step-form"});
  panel.appendChild(form);

  // Regular fields
  (step.fields||[]).forEach(f => {
    form.appendChild(renderField(f));
    if(step.key === "identitas" && f.id === "alamat_no") form.appendChild(fullAddressCascade());
    if(step.key === "resume" && f.id === "asnaf"){
      form.appendChild(el("div",{class:"hint", style:"margin-top:-10px;margin-bottom:16px;"},
        "Disarankan otomatis berdasarkan jawaban sebelumnya — silakan sesuaikan bila perlu. ",
        el("button",{type:"button", class:"inline-btn", style:"margin-top:0;", onclick:()=>{
          formState.asnaf = computeAsnafFull();
          renderWizard(body);
        }}, "↻ Sarankan ulang")
      ));
    }
  });

  // Dynamic tables
  if(step.table) form.appendChild(renderDynTable(step.table));
  if(step.tables) step.tables.forEach(t => form.appendChild(renderDynTable(t)));

  // Kelayakan gauge shown right after penghasilan step & pada step pengeluaran (karena hutang mempengaruhi Gharim)
  if(step.key === "penghasilan" || step.key === "pengeluaran"){
    form.appendChild(renderKifayahGauge());
  }

  // Tanda tangan Surveyor & Penerima Manfaat — ditandatangani langsung di lapangan pada
  // langkah terakhir (Resume & Rekomendasi), sebelum formulir dikirim.
  if(step.key === "resume"){
    form.appendChild(sectionHeading(null, "Tanda Tangan"));
    const sigGrid = el("div",{class:"row2"});
    const selfId = getSelfAssessmentIdentity();

    const surveyorBox = el("div",{class:"sig-box"}, el("div",{class:"q"}, "Surveyor — " + (formState.nama_surveyor || "")));
    if(selfId && selfId.signature){
      // Pejabat sendiri yang jadi surveyor & sudah punya tanda tangan tersimpan di profilnya —
      // otomatis dipakai lagi tanpa perlu digambar ulang tiap kali submit assessment.
      surveyorBox.appendChild(el("div",{class:"hint", style:"margin-bottom:6px;"}, "Tanda tangan otomatis dari profil Anda:"));
      surveyorBox.appendChild(el("img",{src:selfId.signature, style:"max-width:220px;border:1px solid var(--line);border-radius:8px;background:#fff;display:block;"}));
      sigSurveyorFull = { isEmpty: ()=>false, toDataURL: ()=>selfId.signature };
    } else {
      sigSurveyorFull = createSignaturePad();
      surveyorBox.appendChild(sigSurveyorFull.el);
    }
    sigGrid.appendChild(surveyorBox);

    const pengajuBox = el("div",{class:"sig-box"}, el("div",{class:"q"}, "Penerima Manfaat — " + (formState.nama_pengaju || "")));
    sigPengajuFull = createSignaturePad();
    pengajuBox.appendChild(sigPengajuFull.el);
    sigGrid.appendChild(pengajuBox);

    form.appendChild(sigGrid);
  }

  const isLast = currentStepIndex === STEPS.length - 1;
  const foot = el("div",{class:"step-foot"},
    currentStepIndex===0
      ? el("a",{href:"#/", class:"btn btn-ghost"}, "← Batal")
      : el("button",{class:"btn btn-ghost", onclick:()=>{ currentStepIndex--; renderWizard(body); }}, "← Sebelumnya"),
    isLast
      ? el("button",{class:"btn btn-primary", id:"submit-btn", onclick:()=>submitAssessment(body)}, "Kirim Formulir")
      : el("button",{class:"btn btn-primary", onclick:()=>{
          if(validateStep(step)){ currentStepIndex++; renderWizard(body); window.scrollTo(0,0); }
        }}, "Selanjutnya →")
  );
  panel.appendChild(foot);

  body.appendChild(progressMobile);
  body.appendChild(el("div",{class:"wizard"}, railEl, panel));
}

function validateStep(step){
  let ok = true;
  (step.fields||[]).forEach(f=>{
    if(f.required){
      const val = formState[f.id];
      if(val == null || val === "" || (Array.isArray(val) && val.length===0)){
        ok = false;
        toast(`Mohon lengkapi: ${f.label}`);
      }
    }
  });
  return ok;
}

function shouldShow(f){
  if(!f.showIf) return true;
  const v = formState[f.showIf];
  if(f.showIfVal) return v === f.showIfVal;
  return !!v;
}

function renderField(f){
  if(!shouldShow(f)) return el("div",{});
  const wrap = el("div",{class:"field", "data-field-id":f.id});

  if(f.type === "checkbox-single"){
    const checked = !!formState[f.id];
    const optBlock = el("label",{class:"opt-block" + (checked?" checked":"")},
      el("input",{type:"checkbox", checked: checked?"checked":null, onchange:(e)=>{
        formState[f.id] = e.target.checked;
        // re-render to reveal/hide dependent fields
        const body = $("#survey-body"); renderWizard(body);
      }}),
      el("div",{}, el("div",{class:"t"}, f.label))
    );
    wrap.appendChild(optBlock);
    if(f.required) wrap.querySelector(".t").appendChild(el("span",{class:"req"}, " *"));
    return wrap;
  }

  const labelEl = el("label",{class:"q"}, f.label, f.required?el("span",{class:"req"},"*"):null);
  wrap.appendChild(labelEl);

  if(f.type === "radio"){
    const options = el("div",{class:"options"});
    f.options.forEach(opt=>{
      const checked = formState[f.id] === opt;
      const lab = el("label",{class:"opt"+(checked?" checked":"")},
        el("input",{type:"radio", name:f.id, checked: checked?"checked":null, onchange:()=>{
          formState[f.id] = opt;
          const body = $("#survey-body"); renderWizard(body);
        }}),
        el("span",{}, opt)
      );
      options.appendChild(lab);
    });
    wrap.appendChild(options);
  } else if(f.type === "checkbox"){
    const arr = formState[f.id] || [];
    const options = el("div",{class:"options"});
    f.options.forEach(opt=>{
      const checked = arr.includes(opt);
      const lab = el("label",{class:"opt"+(checked?" checked":"")},
        el("input",{type:"checkbox", checked: checked?"checked":null, onchange:(e)=>{
          let a = formState[f.id] || [];
          if(e.target.checked) a = [...a, opt]; else a = a.filter(x=>x!==opt);
          formState[f.id] = a;
          const body = $("#survey-body"); renderWizard(body);
        }}),
        el("span",{}, opt)
      );
      options.appendChild(lab);
    });
    wrap.appendChild(options);
    if(f.id === "asnaf") wrap.appendChild(el("div",{class:"asnaf-note", html: ASNAF_NOTES}));
  } else if(f.type === "textarea"){
    wrap.appendChild(el("textarea",{oninput:(e)=>formState[f.id]=e.target.value}, formState[f.id]||""));
  } else {
    const inputAttrs = { type: f.type, value: formState[f.id]||"", oninput:(e)=>formState[f.id]=e.target.value };
    if(f.maxlength) inputAttrs.maxlength = f.maxlength;
    wrap.appendChild(el("input", inputAttrs));
  }
  if(f.hint) wrap.appendChild(el("div",{class:"hint"}, f.hint));
  return wrap;
}

/* ---------------- Dynamic tables ---------------- */
function calcTableTotal(kind){
  if(kind === "penghasilan") return dynTables.penghasilan.reduce((s,r)=>s+(parseFloat(r.jumlah)||0),0);
  if(kind === "pengeluaran") return dynTables.pengeluaran.reduce((s,r)=>s+(parseFloat(r.jumlah)||0),0);
  if(kind === "hutang") return {
    total: dynTables.hutang.reduce((s,r)=>s+(parseFloat(r.total)||0),0),
    dibayar: dynTables.hutang.reduce((s,r)=>s+(parseFloat(r.dibayar)||0),0),
  };
  return 0;
}

function renderDynTable(kind){
  const wrap = el("div",{class:"field"});
  const titleMap = {
    penghasilan: "Rincian Penghasilan Keluarga",
    pengeluaran: "Rincian Pengeluaran Rumah Tangga per Bulan",
    hutang: "Rincian Hutang – Piutang"
  };
  wrap.appendChild(el("label",{class:"q"}, titleMap[kind]));

  const table = el("table",{class:"dtable"});
  let thead, tbody, tfoot;

  if(kind === "penghasilan"){
    thead = el("thead",{}, el("tr",{},
      el("th",{},"No"), el("th",{},"Nama"), el("th",{},"Hubungan Keluarga"), el("th",{},"Pekerjaan"),
      el("th",{},"Penghasilan / Bulan"), el("th",{})
    ));
    tbody = el("tbody",{});
    dynTables.penghasilan.forEach((row,i)=>{
      tbody.appendChild(el("tr",{},
        el("td",{}, String(i+1)),
        el("td",{}, el("input",{type:"text", value:row.nama, oninput:(e)=>{row.nama=e.target.value;}})),
        el("td",{}, el("input",{type:"text", value:row.hubungan, oninput:(e)=>{row.hubungan=e.target.value;}})),
        el("td",{}, el("input",{type:"text", value:row.pekerjaan, oninput:(e)=>{row.pekerjaan=e.target.value;}})),
        el("td",{}, moneyInput(row.jumlah, (digits)=>{ row.jumlah=digits; refreshGauge(); refreshDynTotal("penghasilan"); })),
        el("td",{}, dynTables.penghasilan.length>1 ? el("button",{class:"rm", onclick:()=>{
          dynTables.penghasilan = dynTables.penghasilan.filter(r=>r.id!==row.id);
          rerenderCurrentStep();
        }}, "✕") : null)
      ));
    });
    tfoot = el("tfoot",{}, el("tr",{}, el("td",{colspan:4},"TOTAL"), el("td",{id:"total-penghasilan"}, fmtRupiah(calcTableTotal("penghasilan"))), el("td",{})));
  }

  if(kind === "pengeluaran"){
    thead = el("thead",{}, el("tr",{}, el("th",{},"No"), el("th",{},"Jenis Pengeluaran"), el("th",{},"Rata-rata / Bulan"), el("th",{})));
    tbody = el("tbody",{});
    dynTables.pengeluaran.forEach((row,i)=>{
      tbody.appendChild(el("tr",{},
        el("td",{}, String(i+1)),
        el("td",{}, row.locked ? row.jenis : el("input",{type:"text", value:row.jenis, oninput:(e)=>{row.jenis=e.target.value;}})),
        el("td",{}, moneyInput(row.jumlah, (digits)=>{ row.jumlah=digits; refreshDynTotal("pengeluaran"); })),
        el("td",{}, !row.locked ? el("button",{class:"rm", onclick:()=>{
          dynTables.pengeluaran = dynTables.pengeluaran.filter(r=>r.id!==row.id);
          rerenderCurrentStep();
        }}, "✕") : null)
      ));
    });
    tfoot = el("tfoot",{}, el("tr",{}, el("td",{colspan:2},"TOTAL"), el("td",{id:"total-pengeluaran"}, fmtRupiah(calcTableTotal("pengeluaran"))), el("td",{})));
  }

  if(kind === "hutang"){
    thead = el("thead",{}, el("tr",{},
      el("th",{},"No"), el("th",{},"Pemberi Hutang"), el("th",{},"Untuk Keperluan"), el("th",{},"Jatuh Tempo"),
      el("th",{},"Status Pelunasan"), el("th",{},"Total Hutang"), el("th",{},"Sudah Dibayar"), el("th",{},"Sisa Hutang"), el("th",{})
    ));
    tbody = el("tbody",{});
    dynTables.hutang.forEach((row,i)=>{
      const sisa = (parseFloat(row.total)||0) - (parseFloat(row.dibayar)||0);
      tbody.appendChild(el("tr",{},
        el("td",{}, String(i+1)),
        el("td",{}, el("input",{type:"text", value:row.pemberi, oninput:(e)=>{row.pemberi=e.target.value;}})),
        el("td",{}, el("input",{type:"text", value:row.keperluan, oninput:(e)=>{row.keperluan=e.target.value;}})),
        el("td",{}, el("input",{type:"date", value:row.jatuh_tempo, oninput:(e)=>{row.jatuh_tempo=e.target.value;}})),
        el("td",{}, el("input",{type:"text", value:row.status, oninput:(e)=>{row.status=e.target.value;}})),
        el("td",{}, moneyInput(row.total, (digits)=>{ row.total=digits; refreshHutangRow(row.id); })),
        el("td",{}, moneyInput(row.dibayar, (digits)=>{ row.dibayar=digits; refreshHutangRow(row.id); })),
        el("td",{class:"mono", id:"sisa-hutang-"+row.id}, fmtRupiah(sisa)),
        el("td",{}, el("button",{class:"rm", onclick:()=>{
          dynTables.hutang = dynTables.hutang.filter(r=>r.id!==row.id);

      ));

    const totals = calcTableTotal("hutang");
    tfoot = el("tfoot",{}, el("tr",{},
      el("td",{colspan:4},"TOTAL"), el("td",{}, ""), el("td",{id:"hutang-foot-total"}, fmtRupiah(totals.total)),
      el("td",{id:"hutang-foot-dibayar"}, fmtRupiah(totals.dibayar)), el("td",{id:"hutang-foot-sisa"}, fmtRupiah(totals.total-totals.dibayar)), el("td",{})
    ));
  }

  table.appendChild(thead); table.appendChild(tbody); table.appendChild(tfoot);
  wrap.appendChild(table);
  wrap.appendChild(el("button",{class:"add-row-btn", type:"button", onclick:()=>{
    dynTables[kind].push(blankRow(kind));
    rerenderCurrentStep();
  }}, "+ Tambah Baris"));
  return wrap;
}

function rerenderCurrentStep(){
  const body = $("#survey-body");
  if(body) renderWizard(body);
}
function refreshDynTotal(kind){
  if(kind === "penghasilan"){
    const cell = $("#total-penghasilan");
    if(cell) cell.textContent = fmtRupiah(calcTableTotal("penghasilan"));
  } else if(kind === "pengeluaran"){
    const cell = $("#total-pengeluaran");
    if(cell) cell.textContent = fmtRupiah(calcTableTotal("pengeluaran"));
  }
}
/* Update baris & footer tabel Hutang langsung lewat DOM (tanpa render ulang seluruh langkah)
   supaya mengetik nominal di HP tidak kehilangan fokus/hanya menerima 1 digit per ketuk. */
function refreshHutangRow(rowId){
  const row = dynTables.hutang.find(r=>r.id===rowId);
  if(!row) return;
  const sisaCell = $("#sisa-hutang-"+rowId);
  if(sisaCell) sisaCell.textContent = fmtRupiah((parseFloat(row.total)||0) - (parseFloat(row.dibayar)||0));
  const totals = calcTableTotal("hutang");
  const totalCell = $("#hutang-foot-total"), dibayarCell = $("#hutang-foot-dibayar"), sisaFootCell = $("#hutang-foot-sisa");
  if(totalCell) totalCell.textContent = fmtRupiah(totals.total);
  if(dibayarCell) dibayarCell.textContent = fmtRupiah(totals.dibayar);
  if(sisaFootCell) sisaFootCell.textContent = fmtRupiah(totals.total-totals.dibayar);
}
function refreshGauge(){
  const g = $("#kifayah-figure");
  if(!g) return;
  const perCapita = getPerCapita();
  g.textContent = perCapita.toLocaleString("id-ID");
  const cls = classifyPerCapita(perCapita);
  const badge = $("#kifayah-badge");
  if(badge) badge.textContent = cls.label;
}
function getPerCapita(){
  const totalPenghasilan = calcTableTotal("penghasilan");
  const tanggungan = parseFloat(formState.jumlah_tanggungan) || 1;
  return totalPenghasilan / Math.max(tanggungan,1);
}
/* Saran otomatis Panduan Asnaf (Full Assessment) berdasarkan jawaban yang sudah diisi —
   surveyor tetap bebas menyesuaikan (centang/hapus) di formulir sesudah ini muncul. */
function computeAsnafFull(){
  const cats = [];
  if(formState.pekerjaan_kepala === "Menganggur") cats.push("Fakir");
  if(getPerCapita() < 979989) cats.push("Miskin");
  if(formState.is_muallaf) cats.push("Muallaf");
  const totalHutang = dynTables.hutang.reduce((s,r)=>s+(parseFloat(r.total)||0),0);
  const totalPenghasilan = calcTableTotal("penghasilan");
  if(totalHutang > 0 && totalHutang > totalPenghasilan) cats.push("Gharim");
  return cats;
}

function renderKifayahGauge(){
  const perCapita = getPerCapita();
  const cls = classifyPerCapita(perCapita);
  return el("div",{class:"kifayah-gauge"},
    el("div",{class:"eyebrow"}, "Kalkulator Kelayakan · Real-time"),
    el("div",{class:"figure"}, el("span",{class:"cur"},"Rp"), el("span",{id:"kifayah-figure"}, Math.round(perCapita).toLocaleString("id-ID")), " /kapita/bulan"),
    el("div",{class:"sub"}, "Dihitung otomatis dari total penghasilan keluarga ÷ jumlah tanggungan"),
    el("div",{class:"badge"}, el("span",{class:"dot"}), el("span",{id:"kifayah-badge"}, cls.label)),
    el("div",{class:"thresholds"},
      el("span",{class: cls.key==="extreme"?"on":""}, "< 351.957 Extreme"),
      el("span",{class: cls.key==="gk"?"on":""}, "< 609.160 GK"),
      el("span",{class: cls.key==="hk"?"on":""}, "< 979.989 HK/Miskin"),
      el("span",{class: ["t1","t2","t3","t4"].includes(cls.key)?"on":""}, "≥ 979.989 Non-prioritas"),
    )
  );
}

/* ---------------- Submit ---------------- */
async function submitAssessment(body){
  const step = STEPS[STEPS.length-1];
  if(!validateStep(step)) return;
  if(!sigSurveyorFull || sigSurveyorFull.isEmpty()){ toast("Mohon bubuhkan tanda tangan Surveyor terlebih dahulu."); return; }
  if(!sigPengajuFull || sigPengajuFull.isEmpty()){ toast("Mohon minta tanda tangan Penerima Manfaat terlebih dahulu."); return; }

  const btn = $("#submit-btn");
  btn.disabled = true;
  btn.innerHTML = "";
  btn.appendChild(el("span",{class:"spinner"}));
  btn.appendChild(document.createTextNode(" Mengirim..."));

  const perCapita = getPerCapita();
  const cls = classifyPerCapita(perCapita);

  const payload = {
    ...formState,
    table_penghasilan: dynTables.penghasilan,
    table_pengeluaran: dynTables.pengeluaran,
    table_hutang: dynTables.hutang,
    total_penghasilan: calcTableTotal("penghasilan"),
    total_pengeluaran: calcTableTotal("pengeluaran"),
    pendapatan_per_kapita: perCapita,
    kategori_had_kifayah: cls.label,
    ttd_petugas: sigSurveyorFull.toDataURL(),
    ttd_pengaju: sigPengajuFull.toDataURL(),
    jenis_form: "full_assessment",
    status_review: "pending",
    assigned_by: ASSIGNED_BY || null,
    performed_by: getSelfAssessmentIdentity()?.email || null,
    submittedAt: FIREBASE_NOT_CONFIGURED ? new Date().toISOString() : firebase.firestore.FieldValue.serverTimestamp(),
  };

  try{
    await ensureAnonAuth();
    if(FIREBASE_NOT_CONFIGURED){
      console.warn("Firebase belum dikonfigurasi. Data tidak benar-benar tersimpan. Payload:", payload);
      await new Promise(r=>setTimeout(r,700));
    } else {
      await db.collection(COLLECTION).add(payload);
      notifyAdmin(`Assessment baru: ${payload.nama_pengaju || "-"} (Full Assessment).`);
    }
    renderSuccessScreen(body, true);
  } catch(err){
    console.error(err);
    toast("Gagal mengirim formulir: " + friendlyFirestoreError(err));
    btn.disabled = false;
    btn.textContent = "Kirim Formulir";
  }
}

function renderSuccessScreen(body, submitted){
  body.innerHTML = "";
  const ref = new Date().toISOString().slice(0,19).replace(/[-:T]/g,"");
  body.appendChild(el("div",{class:"success-screen"},
    el("div",{class:"icon"}, "✓"),
    el("h2",{}, "Formulir Terkirim"),
    el("p",{}, "Terima kasih. Data assessment calon penerima manfaat telah berhasil dikirim dan akan ditinjau oleh admin program."),
    el("div",{class:"ref mono"}, "REF-" + ref),
    el("div",{},
      el("a",{href:"#/survey", class:"btn btn-primary", onclick:()=>setTimeout(()=>location.reload(),50)}, "Isi Formulir Baru")
    )
  ));
}

/* ================================================================
   RAPID ASSESSMENT — alur 3 tahap
   ----------------------------------------------------------------
   1) Surveyor mengisi Data Program + tanda tangan SEKALI di awal
      sesi (disimpan sebagai "sesi" di Firestore koleksi
      rapid_sessions, lalu dipakai ulang untuk seluruh formulir
      individu tanpa perlu tanda tangan berulang).
   2) Surveyor memilih: isi sendiri data calon peserta, ATAU
      bagikan link agar calon peserta mengisi sendiri (sampai poin D).
   3a) Isi sendiri → langsung terkirim ke Admin.
   3b) Lewat link → data masuk daftar "menunggu direview"; surveyor
       menentukan Kelayakan & Catatan per entri, lalu mengirim
       seluruh entri yang sudah direview secara massal ke Admin.
   Kategori Asnaf pada poin E dihitung OTOMATIS dari jawaban.
   ================================================================ */
let rapidSession = null;   // { id, nama_program, tgl_pelaksanaan, lokasi_penyaluran, nama_petugas, petugas_signature }
let rapidMode = null;      // "direct" | "link"
let rapidForm = {};
let rapidCount = 0;
let sigSession = null;     // tanda tangan petugas, tahap 1 (berlaku 1 sesi)
let sigPengaju = null;     // tanda tangan pengaju, khusus mode "direct"
let reviewUnsub = null;

async function ensureAnonAuth(){
  if(FIREBASE_NOT_CONFIGURED || !auth) return;
  if(!auth.currentUser){
    try{ await auth.signInAnonymously(); } catch(e){ console.warn("Gagal anonymous sign-in:", e); }
  }
}

/* Menulis ke koleksi "mail" — dibaca & dikirim otomatis oleh ekstensi
   resmi Firebase "Trigger Email from Firestore" (perlu dipasang
   terpisah di Firebase Console > Extensions). Alamat tujuan diambil
   dari app_settings/notifications yang diisi Admin di dashboard. */
async function notifyAdmin(message){
  if(FIREBASE_NOT_CONFIGURED) return;
  try{
    const settingsDoc = await db.collection("app_settings").doc("notifications").get();
    const emails = settingsDoc.exists ? (settingsDoc.data().emails || "") : "";
    const to = emails.split(",").map(s=>s.trim()).filter(Boolean);
    if(to.length === 0) return;
    await db.collection("mail").add({
      to,
      message: { subject: "Had Kifayah — Data Assessment Baru", text: message + "\n\nSilakan buka Dashboard Admin untuk meninjau." }
    });
  } catch(e){ console.warn("Gagal mengirim notifikasi email:", e); }
}

function renderRapidPage(app){
  // PENTING: TIDAK mereset rapidSession/rapidMode di sini. Surveyor sering berpindah ke
  // Beranda (mis. untuk melihat menu lain) lalu kembali ke Rapid Assessment — sesi yang
  // sedang berjalan (termasuk link yang sudah dibagikan & progres reviewnya) harus tetap ada
  // selama tab browser belum ditutup/dimuat ulang. Untuk mengakhiri sesi, surveyor memakai
  // tombol "Akhiri Sesi" di kartu Data Program (renderProgramBar), yang me-reset secara eksplisit.
  const savedRef = loadActiveSessionRef();
  if(!ASSIGNED_BY && !isKepalaDivisiSelf() && !rapidSession && !savedRef){
    // Tidak ada Link Penugasan DAN tidak sedang/pernah melanjutkan sesi apa pun — jangan
    // izinkan memulai sesi baru tanpa penugasan yang jelas (inilah sumber data "Belum
    // Ditugaskan" di dashboard Kepala Divisi). Kepala Divisi sendiri dikecualikan.
    renderNeedsAssignmentScreen(app, "Rapid Assessment");
    return;
  }
  ensureAnonAuth();
  const wrap = el("div",{});
  wrap.appendChild(topbar(false));
  const shell = el("div",{class:"shell", id:"rapid-shell"});
  wrap.appendChild(shell);
  app.appendChild(wrap);

  if(rapidSession){
    // Sesi masih ada di memori (baru saja pindah menu, belum reload) — langsung lanjutkan.
    renderRapidBody(shell);
    return;
  }
  if(savedRef && !FIREBASE_NOT_CONFIGURED){
    // Memori JS sudah hilang (mis. halaman dimuat ulang) tapi ada jejak sesi tersimpan —
    // tawarkan untuk memuat ulang sesi tsb dari Firestore alih-alih langsung mulai dari nol.
    renderResumePrompt(shell, savedRef);
  } else {
    renderRapidBody(shell);
  }
}

/* ---------------- Persistensi referensi sesi aktif (tahan reload halaman) ----------------
   Firestore tetap jadi sumber kebenaran data sesi; localStorage cuma menyimpan "id sesi mana
   yang sedang aktif" supaya bisa ditawarkan untuk dilanjutkan setelah halaman dimuat ulang. */
const RAPID_SESSION_STORAGE_KEY = "had_kifayah_active_rapid_session";
function saveActiveSessionRef(sessionId, mode){
  try{ localStorage.setItem(RAPID_SESSION_STORAGE_KEY, JSON.stringify({ id: sessionId, mode: mode||null, savedAt: Date.now() })); } catch(e){ /* localStorage tidak tersedia, abaikan */ }
}
function loadActiveSessionRef(){
  try{ const raw = localStorage.getItem(RAPID_SESSION_STORAGE_KEY); return raw ? JSON.parse(raw) : null; } catch(e){ return null; }
}
function clearActiveSessionRef(){
  try{ localStorage.removeItem(RAPID_SESSION_STORAGE_KEY); } catch(e){ /* abaikan */ }
}

  ));

      el("div",{class:"desc"}, "Halaman baru saja dimuat ulang, tapi Anda memiliki sesi Rapid Assessment yang belum diakhiri (mis. link masih dibagikan ke calon peserta). Lanjutkan untuk melihat progres pengisian, atau mulai sesi baru.")

            clearActiveSessionRef();

function renderSessionSetup(shell){
  const temp = {};
  sigSession = null;
  const selfId = getSelfAssessmentIdentity();
  const panel = el("div",{class:"step-panel"},
    el("div",{class:"step-head"},
      el("div",{class:"eyebrow"}, "Tahap 1 · A. Data Program"),
      el("h2",{}, "Mulai Sesi Assessment"),
      el("div",{class:"desc"}, "Data ini melekat pada seluruh formulir individu di sesi ini. Tanda tangan di bawah juga otomatis diterapkan pada setiap formulir yang Anda kirim/review — tidak perlu tanda tangan berulang.")
    ),
    el("div",{class:"row2"},
      plainField("Nama Program", v=>temp.nama_program=v, "text", true),
      plainField("Tanggal Pelaksanaan", v=>temp.tgl_pelaksanaan=v, "date"),
    ),
    el("div",{class:"row2"},
      plainField("Lokasi Penyaluran", v=>temp.lokasi_penyaluran=v),
      plainField("Nama Petugas / Amil", v=>temp.nama_petugas=v, "text", true, selfId?.nama),
    ),
    el("div",{class:"row2"},
      plainPhoneField("No. Telepon Petugas Surveyor", v=>temp.telp_petugas=v, true, selfId?.telp),
      plainSelectField("Kategori Program", PROGRAM_KATEGORI_OPTIONS, v=>temp.kategori_program=v, true),
    ),
  );
  const sigBox = el("div",{class:"sig-box"}, el("div",{class:"q"}, "Tanda Tangan Petugas / Amil (berlaku untuk seluruh sesi ini)"));
  if(selfId && selfId.signature){
    // Pejabat sendiri yang jadi petugas & sudah punya tanda tangan tersimpan di profilnya.
    sigBox.appendChild(el("div",{class:"hint", style:"margin-bottom:6px;"}, "Tanda tangan otomatis dari profil Anda:"));
    sigBox.appendChild(el("img",{src:selfId.signature, style:"max-width:220px;border:1px solid var(--line);border-radius:8px;background:#fff;display:block;"}));
    sigSession = { isEmpty: ()=>false, toDataURL: ()=>selfId.signature };
  } else {
    sigSession = createSignaturePad();
    sigBox.appendChild(sigSession.el);
  }
  panel.appendChild(sigBox);

  panel.appendChild(el("div",{class:"step-foot", style:"justify-content:flex-end;"},
    el("button",{class:"btn btn-primary", onclick: async ()=>{
      if(!temp.nama_program || !temp.nama_petugas){ toast("Nama Program dan Nama Petugas wajib diisi."); return; }
      if(!temp.telp_petugas || !isValidPhone(temp.telp_petugas)){ toast("No. Telepon Petugas Surveyor wajib diisi dengan format angka yang benar."); return; }
      if(!temp.kategori_program){ toast("Mohon pilih Kategori Program."); return; }
      if(sigSession.isEmpty()){ toast("Mohon bubuhkan tanda tangan petugas terlebih dahulu."); return; }
      await ensureAnonAuth();
      if(!FIREBASE_NOT_CONFIGURED && auth && !auth.currentUser){
        toast("Gagal masuk secara anonim. Aktifkan dulu Authentication → Sign-in method → \"Anonymous\" di Firebase Console, lalu coba lagi.");
        return;
      }
      const sessionPayload = {
        ...temp,
        petugas_signature: sigSession.toDataURL(),
        assigned_by: ASSIGNED_BY || null,
        performed_by: getSelfAssessmentIdentity()?.email || null,
        createdAt: FIREBASE_NOT_CONFIGURED ? new Date().toISOString() : firebase.firestore.FieldValue.serverTimestamp(),
      };
      try{
        if(FIREBASE_NOT_CONFIGURED){
          rapidSession = { id: "local-"+uid(), ...sessionPayload };
        } else {
          const ref = await db.collection("rapid_sessions").add(sessionPayload);
          rapidSession = { id: ref.id, ...sessionPayload };
        }
        saveActiveSessionRef(rapidSession.id, null);
        renderRapidBody(shell);
      } catch(err){ toast("Gagal memulai sesi: " + friendlyFirestoreError(err)); }
    }}, "Mulai Assessment →")
  ));
  return panel;
}

function rapidRadioGroup(id, label, options, required, onSelect){
  const wrap = el("div",{class:"field"});
  wrap.appendChild(el("label",{class:"q"}, label, required?el("span",{class:"req"}," *"):null));
  const optsWrap = el("div",{class:"options"});
  options.forEach(opt=>{
    const inp = el("input",{type:"radio", name:"rapid_"+id});
    const lab = el("label",{class:"opt"}, inp, el("span",{}, opt));
    inp.addEventListener("change", ()=>{
      rapidForm[id] = opt;
      $$(".opt", optsWrap).forEach(o=>o.classList.remove("checked"));
      lab.classList.add("checked");
      if(onSelect) onSelect(opt);
    });
    optsWrap.appendChild(lab);
  });
  wrap.appendChild(optsWrap);
  return wrap;
}
function rapidTextField(id, label, opts={}){
  const wrap = el("div",{class:"field"});
  wrap.appendChild(el("label",{class:"q"}, label, opts.required?el("span",{class:"req"}," *"):null));
  const kind = opts.type; // "money" | "nik" | "phone" | tipe HTML native lain | undefined
  const isMoney = kind === "money", isNik = kind === "nik", isPhone = kind === "phone";
  const htmlType = (isMoney || isNik || isPhone) ? "text" : (kind || "text");
  const inputMode = isMoney || isNik ? "numeric" : (isPhone ? "tel" : undefined);
  let initialDisplay = rapidForm[id] || "";
  if(isMoney) initialDisplay = formatRibuanDigits(String(rapidForm[id]||"").replace(/\D/g,""));
  // Catatan: maxlength SENGAJA tidak dipasang untuk NIK — maxlength HTML membatasi jumlah
  // karakter mentah (termasuk huruf jika ada yang ter-paste/salah ketik), bukan jumlah digit,
  // sehingga bisa memotong digit sah sebelum sempat difilter. Pembatasan 16 digit dilakukan
  // murni lewat JS di bawah (strip non-digit lalu slice 16) agar akurat.
  const inp = el("input",{ type: htmlType, inputmode: inputMode, id:"rf-"+id, value: initialDisplay, maxlength: opts.maxlength });
  inp.addEventListener("input", ()=>{
    if(isMoney){
      const digits = inp.value.replace(/\D/g,"");
      rapidForm[id] = digits;
      inp.value = formatRibuanDigits(digits);
    } else if(isNik){
      const digits = inp.value.replace(/\D/g,"").slice(0,16);
      inp.value = digits;
      rapidForm[id] = digits;
    } else if(isPhone){
      const cleaned = inp.value.replace(/[^\d+]/g,"");
      inp.value = cleaned;
      rapidForm[id] = cleaned;
    } else {
      rapidForm[id] = inp.value;
    }
    if(opts.onInput) opts.onInput(inp.value);
  });
  wrap.appendChild(inp);
  if(opts.hint) wrap.appendChild(el("div",{class:"hint"}, opts.hint));
  return wrap;
}
